<body class="sr">
<nav class="nav">

<main class="room">
  <!-- Tulsa-Live dial stack -->
  <div class="lcol">
    <section class="vit" id="vit" aria-label="Storm vitals"></section>
    <aside class="dials one" id="dials" aria-label="Storm dials"></aside>
  </div>

  <!-- the broadcast stage: Tulsa-Live's map + header frame -->
  <section class="stage-wrap">
    <div class="srt" id="tabs" role="tablist"></div>
    <div class="stage" id="stage">
      <div id="map"></div>
      <div class="ovl" id="ovl"></div>
      <div class="frame" id="frame"></div>
      <div class="legend" id="legend"></div>
      <div class="clock" id="tau"></div>
      <div class="strip" id="strip"></div>
      <div class="qgrid" id="quad"></div>
      <div class="lyr" id="lyr" role="dialog" aria-label="Map layers"></div>
      <div class="lyr" id="vwp" role="dialog" aria-label="Share and saved views"></div>
      <div class="lyr" id="setp" role="dialog" aria-label="Settings"></div>
      <div class="swp" id="wipe"><i></i><b></b></div>
    </div>
    <div class="lc" id="lc" hidden></div>
    <div class="lc" id="fb" hidden></div>
    <section class="src c-int"><div class="ch"><span class="ctab"><button data-v="int" class="on">Intensity</button><button data-v="ens">Ensembles</button><button data-v="guid">Peak by model</button></span><span id="intLeg"></span></div><div id="intChart" class="chart"></div><div id="ensChart" class="chart" hidden></div><div id="guid" hidden></div></section>
  </section>

  <!-- right rail -->
  <aside class="rail" id="rail">
    <section class="src c-key" id="cKey"></section>
    <section class="src c-recon" id="cRecon"></section>
  </aside>
</main>


<div class="crawl" id="crawl"><div class="lbl" id="crawlLbl">TROPICS</div><div class="tk"><span id="crawlTx"></span></div></div>
