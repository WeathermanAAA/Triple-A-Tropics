  - id: guidance-basin-scoping
    title: Guidance basin scoping — full for AL/EP/CP, raw ensembles for JTWC
    area: models
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      A hard constraint, enforced in the data rather than in the styling.
      JTWC-basin decks have never carried official, consensus or statistical
      aids, so the builder refuses to classify any JTWC aid as consensus, emits
      no membership strip and no skill baseline there, and the viewer drops the
      consensus tab entirely and says why. This also fixes a live defect: the
      previous per-storm document listed the GEFS ensemble MEAN (AEMN) under
      "consensus" for a West Pacific storm, which tells the reader several
      independent models agree when the truth is that one model was averaged
      with itself. Ensemble means are now their own kind, distinct from
      multi-model consensus, in every basin.
  - id: atcf-guidance-ingest
    title: ATCF a-deck/b-deck ingest + QC, with the filtered-deck accounting
    area: models
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      Guidance ingest off NHC's public FTP, now the sole authorized publisher
      (EMC's mirror went 403 and ospo no longer serves). Every QC rule is
      calibrated against the real decks — all 23 live 2026 files, 521,842
      rows, 106 aids — rather than against the format document. The traps that
      matter: MSLP zero is MISSING and affects 28.9 percent of rows, whole aid
      families never populate it; position 0N/0W is a sentinel carried by
      9,561 rows and is the most dangerous value in the format because it is
      syntactically valid and lands at null island; -99 is a second
      independent sentinel; the primary key is basin/cy/DTG/TECH/TAU/RAD, NOT
      the triple, because the 34/50/64 kt radii records legitimately share it
      and deduplicating on the triple silently discards ~110k real records;
      rows are variable width from 18 to 46 fields; TAU can be negative. The
      motion check runs only after position QC — before it, the sentinel alone
      manufactures 288 false flags with implied speeds to 754 kt. Verified
      against live decks: zero malformed rows in 123k, and the single genuine
      motion flag reproduces exactly.
  - id: adeck-ecmwf-withheld
    title: Public a-deck withholds every ECMWF-derived aid
    area: models
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      Confirmed empirically, not assumed: EMX, EMXI, EMX2, EEMN, EMNI, SHPE,
      DSPE, LGME, EAIO, EAMN, UKM, UKMI, UEMN, FSSE and GFEX have exactly zero
      rows across every live 2026 deck, and no aid id beginning with E exists
      at all. It is deliberate withholding rather than the aid not being
      produced — NHC's own techlist defines them and the post-season archive
      carries them in quantity. There is no public unfiltered fallback;
      /atcf/aid/ returns 404. The consequence is now stated on the page rather
      than glossed: consensus aids like TVCN and RVCN are plottable but NOT
      independently reproducible, because they were computed upstream from
      members we cannot see. A present consensus aid does not imply its
      members are present. Also note nhc_techlist.dat is stale and unusable as
      an allowlist — HFSA and HFSB, the two highest-volume hurricane-model
      aids, are absent from it while the HAFA/HAFB ids it defines have zero
      live rows.
  - id: jtwc-guidance-scoping
    title: JTWC-basin guidance — UCAR only, and no official or consensus aids
    area: models
    status: next
    note: >-
      Re-sampled across cycles to settle it: the feed is STABLE, not stalled,
      and the reported one-cycle lag does not reproduce. At a simultaneous
      fetch, WP 12W and the NHC EP decks shared an identical max DTG and an
      identical 2.1 h lag, and every deck tested showed a gap-free 6-hourly
      ladder. Two findings reshape the work. First, ftp.nhc.noaa.gov carries
      ZERO WP/IO/SH decks — UCAR's adecks_open is the only surviving source,
      though the repo already treats that host as primary for tcvitals so it
      adds no new failure domain. Second, and more consequential: JTWC-basin
      decks have never carried official, consensus, or statistical aids — no
      OFCL, TVCN, IVCN, SHIP, LGEM, HWRF, HFSA or AVNO, 52 techs fewer than
      NHC. They are raw ensembles only. So computing a member consensus and
      labelling it TVCN would be factually wrong, and the official track must
      keep coming from the JTWC warning-text path. Scope as best-effort.
  - id: product-view-telemetry
    title: Per-product view telemetry counters
    area: models
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      The hero-set scheduler needs a popularity term: at fifty models times
      twenty-one products the render budget cannot cover the cross product,
      and "which products do people actually open" is the only honest input to
      deciding what to pre-render. A view is a DISTINCT cycle/storm/model/
      domain/product tuple, not a call — the selection path fires from nine
      places including the 45 s manifest poll's selection regrow, so counting
      calls would inflate a product's score by whatever else the user changed.
      Dwell seconds accrue alongside, capped, and pause while the tab is
      hidden. No identifiers of any kind, and Do Not Track plus Global Privacy
      Control disable collection outright rather than merely withholding
      transmission. Counters aggregate in localStorage; there is no collector
      deployed, so nothing is transmitted unless an endpoint is configured.
  - id: telemetry-collector
    title: Telemetry collector endpoint
    area: models
    status: needs-andrew
    note: >-
      The view counters are instrumented and aggregate locally, but turning
      them into a site-wide popularity signal needs a Worker with a KV or
      Analytics Engine binding on Andrew's Cloudflare account. None of the
      three existing Workers has one. Until then the numbers are per-browser
      and inspectable only via TatTelemetry.snapshot().
  - id: model-record-phase0
    title: Model record — convection treatment, AI paradigm, structural product gating
    area: models
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      Every model now carries two structural claims. convection_explicit says
      whether deep convection is resolved or parameterised, and it GATES the
      products whose signal IS resolved convection — reflectivity and
      simulated 89 GHz microwave. That is a correctness gate, not a
      preference: a reflectivity field off a parameterised-convection model
      is a category error, because the convection that would make the echo
      was removed from the grid by the cumulus scheme, and it renders a
      plausible-looking image that means nothing. So the pair is
      unrenderable, not discouraged — dropped at job planning, refused with
      an exception at the renderer, never written to the manifest, never
      offered by the frontend. Simulated IR and water vapour are NOT gated;
      they track grid-scale cloud and humidity and stay meaningful. The
      ai_paradigm enum drives an AI badge and withholds the intensity
      statistic — current learned emulators under-deepen tropical cyclones as
      a consequence of training resolution and loss, so their VMAX and MSLP
      extrema are artifacts, not forecasts. The field still renders; only the
      number is withheld. Physics-model output is byte-identical.
    links:
      - label: Models
        url: /models/
  - id: ensemble-mean-policy
    title: Ensemble-mean policy with named substitutes
    area: models
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      Each product declares whether a cell-wise mean across members is a
      meaningful field, and where it is not, WHAT to show instead — so a
      denial is constructive rather than a dead end. Denied on TC intensity,
      simulated sensors, precipitation maxima and the sharp
      displacement-sensitive extrema (vorticity, PV, CAPE, SRH); allowed on
      the smooth synoptic mass and environment fields — height, deep-layer
      shear, SST, tropopause temperature, PWAT, layer RH, surface fluxes. Two
      structural rules ride on top so no spec restates them: a
      storm-following nest denies the mean for every product (members centre
      their nests on their own forecast positions, so a cell-wise mean
      averages different places), and the MSLP minimum marker is dropped in
      any mean render. An import-time validator enforces that a substitute is
      named if and only if the mean is denied.
  - id: manifest-geometry-value-plane
    title: Manifest geometry + value planes
    area: models
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      The manifest now carries what a client needs to turn a pixel into a
      number and a place. Frame-invariant half is the projection and the
      pixel canvas; the per-frame half is the drawn axes rect in pixels plus
      its lon/lat extent, keyed by frame rather than by product since all 21
      products of one frame share it. The axes rect is captured AFTER savefig
      — the map letterboxes inside its fixed square box and matplotlib only
      resolves that during the draw, so reading it earlier yields a rect that
      is wrong by the letterbox margin. Projection is plain linear lon/lat,
      so pixel-to-latlon is an exact affine — which is the only way to do it
      on a storm-following nest whose extent moves every forecast hour.
      Prerequisites for lat/lon readout, value readout and a ruler.
  - id: quantity-palette-registry
    title: Palette registry keyed by physical quantity
    area: models
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      Colour scales are now owned once per PHYSICAL QUANTITY in
      tat_palettes.quantities, not per product. At fifty models the same
      quantity is drawn by dozens of products, and unless every one uses
      identical fixed levels a side-by-side comparison measures the palette
      rather than the forecast. Sixteen quantities registered; wind speed is
      now shared by four products and brightness temperature by three. Keys
      are granular enough to pin one scale each, so 850 and 500 mb vorticity
      stay separate. Verified byte-identical: every product's cmap, range,
      boundaries and nine-point RGBA sample unchanged.
  - id: antimeridian-render-fixes
    title: Dateline rendering fixes — CycloLab plot extents and the global track break
    area: obs
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      Two live rendering bugs on DOLPHIN (12W), both rooted in the same thing:
      longitude measured on raw feed values across the antimeridian, where a
      crossing arrives as a sign flip from -178.9 to +179.8. On the home map
      the track split into two polylines that each stopped at their last real
      fix, leaving a 1.3 degree hole on the dateline that read as missing data;
      the split now carries the interpolated crossing point so the halves abut,
      while a genuine reporting gap still renders honestly as a break. In
      CycloLab the Track History and Wind History maps took the raw midpoint of
      -178.9 and 179.8 — the antipode, near 0E — as their window centre, so
      both plots drew over Africa on a near-global grid labelled to 130N and
      105S with the storm a speck. Those two panels are the only callers of
      ensureMinExtent, which is why the failure looked like a wind-radii bug;
      the radii were clean. Extent maths now runs in the shared continuous
      longitude frame, latitude is clamped to the globe, and non-finite or
      sentinel geometry (999/9999 nm radii) is rejected rather than propagated.
    links:
      - label: Global tracks
        url: /global_tracks.html
      - label: CycloLab
        url: /cyclolab/
  - id: jtwc-two-leg-feed
    title: Two-leg JTWC feed — NCEP tcvitals plus public warning text
    area: obs
    status: shipped
    date_shipped: 2026-07-25
    note: >-
      JTWC's public a-decks are gone and the b-decks now reach us only through
      an unofficial mirror that lands about one synoptic cycle late, which is
      why Noul rendered C1 while it was already an 85 kt C2. WP now runs a
      second leg beside the b-deck. Leg 1 is NCEP tcvitals (UCAR's season file,
      NOMADS per-cycle as backup) for position, 1-min wind, MSLP, RMW and 34 kt
      radii. Leg 2 is JTWC's own warning text off NOAA's tgftp bulletin feed for
      the storm TYPE, which tcvitals has no field for, plus the FINAL WARNING
      that is the ACE stop condition. The b-deck still wins wherever it reaches
      (it is post-analysis and carries 50/64 kt radii); the legs only extend
      past its newest fix. A fix whose type cannot be established is counted as
      indeterminate and excluded from ACE rather than guessed. AL/EP are
      untouched and byte-identical — NHC serves its own decks on time.
    links:
      - label: WPac tracks
        url: /climatology/west-pacific/tracks/
  - id: fleet-conventions
    title: Fleet conventions for multi-box operation
    area: infra
    status: shipped
    date_shipped: 2026-07-25
    note: >-
      Box 2 arrived, so the conventions went in while the fleet was still small
      enough to change cheaply. fleet.yml is the inventory AND the lane-to-box
      assignment map; scripts/fleet.sh is the one entry point (status, drift,
      provision, deploy, setenv, lanes). Git rule is fleet-wide and mechanical -
      every box tracks origin/main only, and drift is reported as an incident
      rather than tolerated as a state. provision_box.sh makes box N+1 a step
      instead of a bespoke build, and anything a future box needs goes in it so
      box N+2 inherits the fix. Secrets stay in each box's .env with one
      command to roll a credential fleet-wide. Documented in RUNBOOK-FLEET.md.
    links:
      - label: Fleet health
        url: /fleet/
  - id: fleet-health-page
    title: Per-box heartbeat + /fleet/ health page
    area: infra
    status: shipped
    date_shipped: 2026-07-25
    note: >-
      Every box publishes liveness to R2 once a minute from the HOST (not a
      container, so it keeps reporting when every container is dead), and
      /fleet/ renders it. Closes the "silent box" gap - a dead box used to just
      stop publishing frames, which is indistinguishable from a quiet basin on
      the imagery pages. Carries sha/branch/dirty so drift shows up on the
      health page too, plus load per core, memory, disk, OOM kills, and which
      lanes are up vs exited.
    links:
      - label: Fleet health
        url: /fleet/
  - id: box2-migration
    title: Box 2 online; ring split across two boxes
    area: satellite
    status: shipped
    date_shipped: 2026-07-25
    note: >-
      Hostinger flagged box1 as pegged. Provisioned box2 (8 vCPU / 31 GB,
