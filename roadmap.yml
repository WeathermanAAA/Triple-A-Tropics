  - id: guidance-basin-scoping
    title: Guidance basin scoping — full for AL/EP/CP, raw ensembles for JTWC
    area: models
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      A hard constraint, enforced in the data rather than in the styling.
      JTWC-basin decks have never carried official, consensus or statistical
      aids, so the builder refuses to classify any JTWC aid as consensus, emits
      no membership strip and no skill baseline there, and the viewer drops the
      consensus tab entirely and says why. This also fixes a live defect: the
      previous per-storm document listed the GEFS ensemble MEAN (AEMN) under
      "consensus" for a West Pacific storm, which tells the reader several
      independent models agree when the truth is that one model was averaged
      with itself. Ensemble means are now their own kind, distinct from
      multi-model consensus, in every basin.
  - id: atcf-guidance-ingest
    title: ATCF a-deck/b-deck ingest + QC, with the filtered-deck accounting
    area: models
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      Guidance ingest off NHC's public FTP, now the sole authorized publisher
      (EMC's mirror went 403 and ospo no longer serves). Every QC rule is
      calibrated against the real decks — all 23 live 2026 files, 521,842
      rows, 106 aids — rather than against the format document. The traps that
      matter: MSLP zero is MISSING and affects 28.9 percent of rows, whole aid
      families never populate it; position 0N/0W is a sentinel carried by
      9,561 rows and is the most dangerous value in the format because it is
      syntactically valid and lands at null island; -99 is a second
      independent sentinel; the primary key is basin/cy/DTG/TECH/TAU/RAD, NOT
      the triple, because the 34/50/64 kt radii records legitimately share it
      and deduplicating on the triple silently discards ~110k real records;
      rows are variable width from 18 to 46 fields; TAU can be negative. The
      motion check runs only after position QC — before it, the sentinel alone
      manufactures 288 false flags with implied speeds to 754 kt. Verified
      against live decks: zero malformed rows in 123k, and the single genuine
      motion flag reproduces exactly.
  - id: adeck-ecmwf-withheld
    title: Public a-deck withholds every ECMWF-derived aid
    area: models
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      Confirmed empirically, not assumed: EMX, EMXI, EMX2, EEMN, EMNI, SHPE,
      DSPE, LGME, EAIO, EAMN, UKM, UKMI, UEMN, FSSE and GFEX have exactly zero
      rows across every live 2026 deck, and no aid id beginning with E exists
      at all. It is deliberate withholding rather than the aid not being
      produced — NHC's own techlist defines them and the post-season archive
      carries them in quantity. There is no public unfiltered fallback;
      /atcf/aid/ returns 404. The consequence is now stated on the page rather
      than glossed: consensus aids like TVCN and RVCN are plottable but NOT
      independently reproducible, because they were computed upstream from
      members we cannot see. A present consensus aid does not imply its
      members are present. Also note nhc_techlist.dat is stale and unusable as
      an allowlist — HFSA and HFSB, the two highest-volume hurricane-model
      aids, are absent from it while the HAFA/HAFB ids it defines have zero
      live rows.
  - id: jtwc-guidance-scoping
    title: JTWC-basin guidance — UCAR only, and no official or consensus aids
    area: models
    status: next
    note: >-
      Re-sampled across cycles to settle it: the feed is STABLE, not stalled,
      and the reported one-cycle lag does not reproduce. At a simultaneous
      fetch, WP 12W and the NHC EP decks shared an identical max DTG and an
      identical 2.1 h lag, and every deck tested showed a gap-free 6-hourly
