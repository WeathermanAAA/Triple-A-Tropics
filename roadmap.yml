# (shadow tester board, unlinked + noindexed).
#
# AGENT RULE (also in CLAUDE.md): when you ship something, update its item's
# status HERE in the SAME commit — exactly like AGENT_STATUS.md. New work
# discovered mid-session gets a new item. Bump `updated:` in every commit
# that edits this file; it is the board's honest "last updated" stamp
# (GitHub Pages' Last-Modified header is deploy-wide, so the field is the
# only per-file truth available without API calls).
#
# FORMAT — parsed client-side by roadmap/roadmap.js (tiny YAML subset,
# validated loudly; a bad edit shows as a red banner on the board):
#   - 2-space indents, spaces only; no tabs
#   - one-line values; quote a value if it contains ": " or starts with a
#     special character; ">-" folds an indented block into one line
#   - full-line # comments only (no trailing comments)
#   - no flow collections [ ] { }, no anchors/aliases
# Item schema:
#   id            kebab-case, unique, stable (deep links use it)
#   title         short (<=90 chars); put detail in note
#   area          satellite | obs | records | models | infra | apps | community
#   status        shipped | active | shadow | needs-andrew | next | planned | blocked
#   date_shipped  YYYY-MM-DD, required on shipped items only
#   note          optional detail (quoted, or ">-" folded block)
#   links         optional list of {label, url} (site-relative or https)
# Statuses: shipped = live · active = in progress · shadow = built, awaiting
# Andrew's review/merge · needs-andrew = blocked on his decision/credential ·
# next = specced, queued · planned = backlog · blocked = external dependency.
# Run `python -m unittest tests.test_roadmap_board` (needs node) to check an
