      readout was edge-propagation noise) — the page posts to the same-zone
      URL; workers.dev stays as a smoke surface. The D1/KV/R2 gap on THIS
      token is real (re-verified against the list endpoints, code 10000
      each); the relay stands, and would collapse to a direct R2 put only if
      the existing Triple-a-Weather token were added to the Codespace — no
      new credential needed for anything. Headroom: worker 100k req/day;
      dispatch ~5k/hr; Actions minutes free (public repo); R2 one
      write/batch vs 1M/mo free tier; ceiling is Actions-run noise, revisit
      ~500 batches/day. Unblocks the hero-set scheduler (spec 30). Proven:
      403 wrong-origin, 204 valid on BOTH surfaces, ingest run success,
      batch on R2.
  - id: model-record-phase0
    title: Model record — convection treatment, AI paradigm, structural product gating
    area: models
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      Every model now carries two structural claims. convection_explicit says
      whether deep convection is resolved or parameterised, and it GATES the
      products whose signal IS resolved convection — reflectivity and
      simulated 89 GHz microwave. That is a correctness gate, not a
      preference: a reflectivity field off a parameterised-convection model
      is a category error, because the convection that would make the echo
      was removed from the grid by the cumulus scheme, and it renders a
      plausible-looking image that means nothing. So the pair is
      unrenderable, not discouraged — dropped at job planning, refused with
      an exception at the renderer, never written to the manifest, never
      offered by the frontend. Simulated IR and water vapour are NOT gated;
      they track grid-scale cloud and humidity and stay meaningful. The
      ai_paradigm enum drives an AI badge and withholds the intensity
      statistic — current learned emulators under-deepen tropical cyclones as
      a consequence of training resolution and loss, so their VMAX and MSLP
      extrema are artifacts, not forecasts. The field still renders; only the
      number is withheld. Physics-model output is byte-identical.
    links:
      - label: Models
        url: /models/
  - id: ensemble-mean-policy
    title: Ensemble-mean policy with named substitutes
    area: models
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      Each product declares whether a cell-wise mean across members is a
      meaningful field, and where it is not, WHAT to show instead — so a
      denial is constructive rather than a dead end. Denied on TC intensity,
      simulated sensors, precipitation maxima and the sharp
      displacement-sensitive extrema (vorticity, PV, CAPE, SRH); allowed on
      the smooth synoptic mass and environment fields — height, deep-layer
      shear, SST, tropopause temperature, PWAT, layer RH, surface fluxes. Two
      structural rules ride on top so no spec restates them: a
      storm-following nest denies the mean for every product (members centre
      their nests on their own forecast positions, so a cell-wise mean
      averages different places), and the MSLP minimum marker is dropped in
      any mean render. An import-time validator enforces that a substitute is
      named if and only if the mean is denied.
  - id: manifest-geometry-value-plane
    title: Manifest geometry + value planes
    area: models
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      The manifest now carries what a client needs to turn a pixel into a
      number and a place. Frame-invariant half is the projection and the
      pixel canvas; the per-frame half is the drawn axes rect in pixels plus
      its lon/lat extent, keyed by frame rather than by product since all 21
      products of one frame share it. The axes rect is captured AFTER savefig
      — the map letterboxes inside its fixed square box and matplotlib only
      resolves that during the draw, so reading it earlier yields a rect that
      is wrong by the letterbox margin. Projection is plain linear lon/lat,
      so pixel-to-latlon is an exact affine — which is the only way to do it
      on a storm-following nest whose extent moves every forecast hour.
      Prerequisites for lat/lon readout, value readout and a ruler.
  - id: quantity-palette-registry
    title: Palette registry keyed by physical quantity
    area: models
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      Colour scales are now owned once per PHYSICAL QUANTITY in
      tat_palettes.quantities, not per product. At fifty models the same
      quantity is drawn by dozens of products, and unless every one uses
      identical fixed levels a side-by-side comparison measures the palette
      rather than the forecast. Sixteen quantities registered; wind speed is
      now shared by four products and brightness temperature by three. Keys
      are granular enough to pin one scale each, so 850 and 500 mb vorticity
      stay separate. Verified byte-identical: every product's cmap, range,
      boundaries and nine-point RGBA sample unchanged.
  - id: antimeridian-render-fixes
    title: Dateline rendering fixes — CycloLab plot extents and the global track break
    area: obs
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      Two live rendering bugs on DOLPHIN (12W), both rooted in the same thing:
      longitude measured on raw feed values across the antimeridian, where a
      crossing arrives as a sign flip from -178.9 to +179.8. On the home map
      the track split into two polylines that each stopped at their last real
      fix, leaving a 1.3 degree hole on the dateline that read as missing data;
      the split now carries the interpolated crossing point so the halves abut,
      while a genuine reporting gap still renders honestly as a break. In
      CycloLab the Track History and Wind History maps took the raw midpoint of
      -178.9 and 179.8 — the antipode, near 0E — as their window centre, so
      both plots drew over Africa on a near-global grid labelled to 130N and
      105S with the storm a speck. Those two panels are the only callers of
      ensureMinExtent, which is why the failure looked like a wind-radii bug;
      the radii were clean. Extent maths now runs in the shared continuous
      longitude frame, latitude is clamped to the globe, and non-finite or
      sentinel geometry (999/9999 nm radii) is rejected rather than propagated.
    links:
