  - id: hafs-stall-root-cause
    title: HAFS staleness root cause found and killed — it was never the network
    area: models
    status: shipped
    date_shipped: 2026-08-03
    note: >-
      The stall forensics fired on incident #5 and the evidence overturned the
      whole theory: at the live wedge the WORKERS DID NOT EXIST — no python
      children, no curl, nothing blocked in any fetch — while the parent
      waited on futures that could never resolve. Reproduced locally 3/3 on
      stock CPython 3.11.9 AND 3.12.1 with memory-churning no-op tasks:
      ProcessPoolExecutor with max_tasks_per_child zombifies the pool at the
      FIRST worker recycle (width 2 x recycle 12 = completions stop at
      exactly 24 — the wedge-at-~23-frames signature of every incident, and
      the parameter landed 2026-07-29 in the ingest memory rework, the exact
      day the incidents began). Fix: recycling moved to the POOL level — a
      fresh executor per chunk of width x 12 tasks, the identical per-worker
      RSS bound with none of the machinery; the real _run_pool now completes
      80/80 past the boundary on the same 3.11.9 that wedged raw. Plus a
      C-level self-rescue (faulthandler.dump_traceback_later, exit=True)
      after the manifest commit point, because incident #5 also showed the
      finished salvage's process sitting alive 2.5 h AFTER writing the
      manifest — next time the log gets every thread's stack and the publish
      steps still run. Forensics now also dump the parent's threads and the
      executor's internal state.
  - id: hafs-teardown-commit-point
    title: HAFS builder — a finished build can never again be lost to teardown
    area: models
    status: shipped
    date_shipped: 2026-08-01
    note: >-
      Incident #4's second defect, fixed first (cheapest, and it cost a
      finished cycle): the stage-deadline path now SIGKILLs and reaps wedged
      workers (terminate()'s SIGTERM is a no-op against a call blocked inside
      a C extension — signals only run between bytecodes; both workers
      outlived it by 2.5 h, keeping a queue pipe open whose unbounded
      multiprocessing finalizer join then hung the MAIN thread from cyclic GC
      one second short of the manifest write), the manifest write is the
      documented commit point with nothing blockable ahead of it, and the
      entrypoint hard-exits via os._exit so no join, atexit hook or finaliser
      can hold a finished build hostage. Proven behaviourally: a pool of
      deliberately unkillable workers (SIGTERM masked, wedged in one long C
      call) is salvaged at the deadline, actually dies, and the post-stage
      gc.collect() that killed run 30661097361 returns instantly. Also armed:
      STALL FORENSICS — if ingest completions stop for 8 min the builder
      captures py-spy stacks, /proc State/wchan/syscall/kernel stacks and the
      full process tree from the LIVE wedge, so the next stall reports where
      it blocks instead of dying silently; the fetch-path bound gets chosen
      from that evidence, not from a third guessed Python-level timeout.
