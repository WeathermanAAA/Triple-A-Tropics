  - id: ensemble-paintball
    title: Ensemble track paintball — ECMWF ENS 51 members + GEFS 31, ingest landed
    area: models
    status: active
    note: >-
      Ingest and decode are done and verified; the on-page paintball rendering
      is not, so this is active rather than shipped. ECMWF ENS comes from
      ECMWF's own open-data cyclone-track BUFR — one 1.4 MB file per cycle
      carrying every storm, all 51 members and every step to 360 h — and GEFS
      comes free from the ATCF a-deck already ingested. No tracking is done
      here; both centres publish their own tracker's output. Works in EVERY
      basin, which the deck-derived guidance does not, so a West Pacific storm
      gets a real 51-member ECMWF paintball even where no consensus or official
      aid exists. Two traps found and pinned by tests. The BUFR is COMPRESSED
      with one subset per member and eccodes ignores extractSubset entirely,
      returning identical arrays for every subset — the real layout is
      subset-minor, and the naive member-major read produces tracks that jitter
      by whole degrees between 6-hourly steps rather than failing. And ECMWF's
      storm number is its own sequence: DOLPHIN is 15W to ECMWF and WP12 to
      JTWC, where WP12 is a different system entirely, so matching runs on name
      first and drops anything ambiguous rather than guessing.
  - id: ships-panel
    title: SHIPS panel — intensity traces, environment, contribution waterfall, RI
    area: models
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      The SHIPS diagnostics land as a tab on the same storm-keyed CycloLab
      surface as the guidance layer, reading OUR OWN R2 archive rather than
      NHC so the panel and the archive can never disagree. Four blocks:
      intensity forecast with the previous cycles ghosted so the trend is
      visible, environment as small multiples with the current value printed
      beside each, the per-predictor contribution waterfall, and RI
      probability shown against its own climatological base rate — an 8
      percent chance is above climatology at one threshold and below it at
      another, and the multiple is the only way to tell which. AL/EP/CP only,
      so the tab is never offered in a JTWC basin where no SHIPS file exists.
      A CORRECTION TO THE BRIEF: the premise was that TOTAL CHANGE sums exactly
      to its 19 components. It does not — measured across the archived season,
      only 43.5 percent of columns agree and the residual reaches 4 kt, because
      every component and the total are printed rounded to whole knots. The
      waterfall therefore closes on the published total with the difference
      drawn as a labelled rounding term, rather than stacking short of its own
      total or absorbing the gap silently into the last component.
    links:
      - label: CycloLab storm page
        url: /cyclolab/NHC_EP072026/
  - id: ships-raw-archive
    title: SHIPS raw archive — stext + lsdiag siblings copied to R2 before they age out
    area: models
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      There is no archive of these products anywhere on the NHC FTP —
      /atcf/archive/ carries zero ships and zero lsdiag files — and the live
      directories hold ONE SEASON (measured: /atcf/stext/ spans 2026-03-06 to
      2026-07-28). At season rollover that history is unrecoverable from
      anywhere, so this shipped before anything that parses the data: archiving
      is a one-shot opportunity, parsing is a revisable decision. Raw bytes
      only, keyed by storm and cycle using the same sid CycloLab uses. Both
      sides are tracked INDEPENDENTLY because the low and high layer RH rows
      live only in the lsdiag sibling and the two are not strictly 1:1 —
      measured 270 stems with both, 1 bulletin-only, 7 sibling-only. Test decks
      (cyclone numbers 80-89, carrying forecast VMAX to 337 kt) never enter the
      archive. The archive is immutable and append-only, so a truncated re-read
      can never replace a good capture, and an empty body is refused rather
      than stored — an empty capture would mark the stem archived and it would
      never be retried. Losing the index costs one slow run, not the archive:
      it is rebuilt by listing the bucket. Backfilled the full season on the
      first run: 548 files across 278 storm-cycles, zero failures.
    links:
