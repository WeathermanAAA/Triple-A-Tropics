  - id: antimeridian-render-fixes
    title: Dateline rendering fixes — CycloLab plot extents and the global track break
    area: obs
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      Two live rendering bugs on DOLPHIN (12W), both rooted in the same thing:
      longitude measured on raw feed values across the antimeridian, where a
      crossing arrives as a sign flip from -178.9 to +179.8. On the home map
      the track split into two polylines that each stopped at their last real
      fix, leaving a 1.3 degree hole on the dateline that read as missing data;
      the split now carries the interpolated crossing point so the halves abut,
      while a genuine reporting gap still renders honestly as a break. In
      CycloLab the Track History and Wind History maps took the raw midpoint of
      -178.9 and 179.8 — the antipode, near 0E — as their window centre, so
      both plots drew over Africa on a near-global grid labelled to 130N and
      105S with the storm a speck. Those two panels are the only callers of
      ensureMinExtent, which is why the failure looked like a wind-radii bug;
      the radii were clean. Extent maths now runs in the shared continuous
      longitude frame, latitude is clamped to the globe, and non-finite or
      sentinel geometry (999/9999 nm radii) is rejected rather than propagated.
    links:
      - label: Global tracks
        url: /global_tracks.html
      - label: CycloLab
        url: /cyclolab/
  - id: jtwc-two-leg-feed
    title: Two-leg JTWC feed — NCEP tcvitals plus public warning text
    area: obs
    status: shipped
    date_shipped: 2026-07-25
    note: >-
      JTWC's public a-decks are gone and the b-decks now reach us only through
      an unofficial mirror that lands about one synoptic cycle late, which is
      why Noul rendered C1 while it was already an 85 kt C2. WP now runs a
      second leg beside the b-deck. Leg 1 is NCEP tcvitals (UCAR's season file,
      NOMADS per-cycle as backup) for position, 1-min wind, MSLP, RMW and 34 kt
      radii. Leg 2 is JTWC's own warning text off NOAA's tgftp bulletin feed for
      the storm TYPE, which tcvitals has no field for, plus the FINAL WARNING
      that is the ACE stop condition. The b-deck still wins wherever it reaches
      (it is post-analysis and carries 50/64 kt radii); the legs only extend
      past its newest fix. A fix whose type cannot be established is counted as
      indeterminate and excluded from ACE rather than guessed. AL/EP are
      untouched and byte-identical — NHC serves its own decks on time.
    links:
      - label: WPac tracks
        url: /climatology/west-pacific/tracks/
  - id: fleet-conventions
    title: Fleet conventions for multi-box operation
    area: infra
    status: shipped
    date_shipped: 2026-07-25
    note: >-
      Box 2 arrived, so the conventions went in while the fleet was still small
      enough to change cheaply. fleet.yml is the inventory AND the lane-to-box
      assignment map; scripts/fleet.sh is the one entry point (status, drift,
      provision, deploy, setenv, lanes). Git rule is fleet-wide and mechanical -
      every box tracks origin/main only, and drift is reported as an incident
      rather than tolerated as a state. provision_box.sh makes box N+1 a step
      instead of a bespoke build, and anything a future box needs goes in it so
      box N+2 inherits the fix. Secrets stay in each box's .env with one
      command to roll a credential fleet-wide. Documented in RUNBOOK-FLEET.md.
    links:
      - label: Fleet health
        url: /fleet/
  - id: fleet-health-page
    title: Per-box heartbeat + /fleet/ health page
    area: infra
    status: shipped
    date_shipped: 2026-07-25
    note: >-
      Every box publishes liveness to R2 once a minute from the HOST (not a
      container, so it keeps reporting when every container is dead), and
      /fleet/ renders it. Closes the "silent box" gap - a dead box used to just
      stop publishing frames, which is indistinguishable from a quiet basin on
      the imagery pages. Carries sha/branch/dirty so drift shows up on the
      health page too, plus load per core, memory, disk, OOM kills, and which
      lanes are up vs exited.
    links:
      - label: Fleet health
        url: /fleet/
  - id: box2-migration
    title: Box 2 online; ring split across two boxes
    area: satellite
    status: shipped
    date_shipped: 2026-07-25
    note: >-
      Hostinger flagged box1 as pegged. Provisioned box2 (8 vCPU / 31 GB,
      Boston) with the new provisioning script and moved the two Himawari lanes
      onto it, then GK-2A, MTG, the GEO composite, and the expensive z7 CONUS
      lane as heartbeats showed the real balance. box1 load 9-10 -> ~5, free
      RAM ~1 GB -> ~13 GB. Spent the freed capacity on CONUS at its native
      5-min grid and on splitting each full disk's loop leads into their own
      container so lead latency is a ~3 min pass instead of a ~36 min sweep;
      browse bands went from a 30-min to a 20-min grid.
    links:
      - label: Fleet health
        url: /fleet/
  - id: per-satellite-emit-lanes
    title: Per-satellite emit lanes at native cadence
    area: satellite
    status: shipped
    date_shipped: 2026-07-25
    note: >-
      Every ring member now emits on its own schedule instead of waiting its
      turn in one shared rotation, which had GK-2A publishing about every 5 h
      against a sensor that scans every 10 min. Unblocking it needed the emit
      cost model fixed first: the manifest rebuild was enumerating every tile
      of every retained frame (460k keys / 239 s on the ring composite, twice
      per product-slot), so native cadence was impossible at any core count.
      Reading the key layout with delimiter listings instead made it ~1.4 s,
      and threading the tile cut plus dropping the WebP encoder effort to
      libwebp's default (3x faster at identical PSNR on real tiles) cut the
      render. Full-disk product-slot 116 s to 39 s; ring composite 363 s to
      ~60 s; the 28-product CONUS index write 18 min to 52 s.
    links:
      - label: Explorer
        url: /satellite/explorer/
  - id: fd-availability-id-fix
    title: Full-disk product gating fixed
    area: satellite
    status: shipped
    date_shipped: 2026-07-25
    note: >-
      Every product switch on GOES-19 and Himawari-9 Full Disk was silently
      blocked and every field click ejected to CONUS: the generated catalog
      freezes one export sector per satellite, so its ids never matched the
      per-domain availability sets the explorer probes from R2. Ids are now
      sector-rewritten the same way manifest paths already were.
    links:
      - label: Explorer
        url: /satellite/explorer/
  - id: ring-cadence-ceiling
    title: Ring cadence ceiling on the current box
    area: satellite
    status: shadow
    note: >-
      Measured 2026-07-25: the full browse catalog for every ring member at
      native cadence needs ~12.6 cores of cut CPU; the box has 8, of which
      ~6 are free after the render stack. RAM binds first - a full-disk cut
      peaks ~4.5 GB and the non-s2 stacks hold ~12 GB of 31 GB, so ~5 heavy
      lanes is the ceiling (eight tripped the host OOM killer). What holds
      today: native 10-min frame SPACING on every loop-lead product. What
      does not: lead LATENCY is one pass (~36 min measured, so newest frame
      18-28 min old), browse bands sit on a 30-min grid revisited ~142 min,
      and CONUS runs a 10-min grid against its 5-min scan. Closing those
      needs roughly double the cores and RAM. RESOLVED IN PART 2026-07-25 by
      box2: CONUS now runs its native 5-min grid, full-disk loop leads have
      ~3-min-pass latency, and browse bands are on a 20-min grid. Still short
      of native: browse bands (20 min vs 10), which needs a third box.
    links:
      - label: Explorer
        url: /satellite/explorer/
