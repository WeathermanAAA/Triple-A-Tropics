        url: /models/
  - id: verification-scoreboard
    title: Homogeneous verification scoreboard — the headline differentiator
    area: models
    status: shipped
    date_shipped: 2026-07-31
    note: >-
      Model track and intensity error verification on the storm-keyed CycloLab
      page, season to date per NHC basin — the item the spec rates impact 10
      because nobody in the class ships one. The rules are the product.
      HOMOGENEITY IS A HARD FILTER: models are compared only on cases where
      every model in the panel has a forecast, so a model cannot look better by
      skipping hard cases; when the filter starves the sample, models are
      dropped (least coverage first, recorded and shown) rather than the filter
      relaxed, and lead times still short are omitted with their n printed. N
      UNDER EVERY POINT, always, plus the storm count. Confidence intervals
      BLOCK-BOOTSTRAP OVER STORMS because consecutive 6-hourly forecasts of one
      storm are near-duplicates; a single-storm sample shows no interval rather
      than a fake one. EARLY AND LATE ARE NEVER POOLED — separate panels, since
      a late aid's apparent skill is partly hindsight. OCD5 is the protected
      no-skill baseline that coverage pressure can never evict, and every model
      carries its skill percentage against it. The page states plainly that the
      operational b-deck SELF-CORRECTS (observed: a published 140 kt fix
      revised to 150/909), so all scores are provisional until post-season
      reanalysis, and that the public a-deck withholds every ECMWF-derived and
      UKMET aid — the board is not silently omitting the models people most
      want compared; no public feed can score them. One engine catch made the
      cut: NNIC is an intensity consensus whose positions are not track
      forecasts (628 nm at 120 h against TVCN's 82 in the same homogeneous
      sample), so intensity-consensus aids are excluded from track panels while
      staying fully eligible for intensity. JTWC basins render the structural
      explanation instead of a board. First real numbers, EP 2026 to date,
      seven storms, 864 cases: OFCL 18.7 nm at 12 h to 59.9 at 120 h, the
      consensus cluster at 82-92, OCD5 climbing to 269 — textbook shapes, which
      is the sanity check passing.
    links:
      - label: CycloLab storm page (Scores tab)
        url: /cyclolab/NHC_EP072026/
  - id: png8-fixed-palette
    title: PNG-8 fixed-palette frames — shipped where bit-exactness is possible
    area: models
    status: shipped
    date_shipped: 2026-07-31
    note: >-
      The build's premise was bit-exactness on 100 percent of colortable fill
      pixels, and measurement on real production frames falsified that premise
      for most products: every continuous colour ramp carries 257 to 871 LUT
      entries and EVERY entry appears in real frames (a smooth field sweeps its
      whole ramp), so a 256-entry PNG-8 palette cannot hold them — quantizing
      those products would nearest-map genuine fill colours, exactly the
      probably-identical outcome the requirement forbids. So the encoder is
      structurally scoped: a product is eligible only when its complete
      colortable fits with room for overlays, which today means the discrete
      reflectivity table (14 colours), and any future discrete product
      inherits the win automatically. Every emitted PNG-8 is decoded back and
      verified bit-exact on every colortable pixel BEFORE it is written,
      per frame rather than by sampling, with automatic PNG-24 fallback on
      any failure. Measured on six real reflectivity frames: 32.2 percent of
      PNG-24 bytes aggregate (the spec predicted 31.8), decode 6.4x faster,
      about 1.1 s of transcode cost per frame including the verification, and
      anti-aliased text and contours visually indistinguishable (3 percent of
      pixels move by a mean channel delta of about 12, all in AA blends).
