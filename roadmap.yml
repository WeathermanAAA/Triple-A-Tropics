  - id: global-ace-ptc-decay-fix
    title: Global header ACE reconciled — a decaying former TC can no longer wear the PTC flag
    area: obs
    status: shipped
    date_shipped: 2026-08-03
    note: >-
      The home map header baked 200.59 ACE while the live-status strip summed
      226.70 — the difference was exactly Genevieve (EP07, former category 5,
      26.117 ACE). Her b-deck decayed to a remnant-low LO fix while NHC was
      still advising the post-tropical low, which matched the Potential
      Tropical Cyclone promotion gate (designated + NHC-listed + DB/DS
      nature), and the header stats exclude PTC-flagged storms on the
      assumption their ACE is zero by construction. Three-layer fix in
      ace_core 0.8.13. One, a pre-genesis guard: a system with any
      TS/SS/MX-natured fix in its ACE-nature history, or accrued ACE without
      an explicit NHC "PC" classification, has already undergone genesis and
      is never promoted — post-tropical is not potential. Two, the header
      season ACE now sums every storm's ledger ACE regardless of flags
      (genuine invests and PTCs carry zero by construction), so a wrong flag
      can never again subtract real ACE from the header and the baked total
      equals the ACE strip by construction. Three, "PTC" removed from the
      potential-TC classification synonyms — in NHC's CurrentStorms
      vocabulary PTC means POST-tropical; "PC" is the observed pre-genesis
      code. Adversarially reviewed (three lenses) with the review's own edge
      findings folded back in and pinned by tests: presentational-TS
      provisional fills, frontal-origin pre-genesis ET fixes, and the
      provisional blank-nature ACE loophole all resolve in the genuine PTC's
      favor. The wrong window self-healed live when NHC's final advisory
      dropped Genevieve from CurrentStorms; the fix removes the recurrence —
      this fires for every AL/EP storm that decays under advisories.
  - id: hafs-hang-incident-3
    title: HAFS staleness incident 3 — ingest hang-proofed, alerting re-armed
    area: infra
    status: shipped
    date_shipped: 2026-07-31
    note: >-
      Diagnosed rather than restarted. The cycles were NOT over budget: every
      Actions run since Jul 29 02Z wedged the same way — ingest reached about
      23 of 258 frames in seven minutes, then sat silent for 5h43m until the
      350-minute timeout killed it with zero frames rendered. Same code, same
      dependency versions, same runner image on both sides of the boundary,
      and the very frames in the stall window ingest in 14-17 seconds from a
      codespace — the stall is the Actions-egress path to the HAFS S3 bucket,
      outside our control. The defect at our layer: no timeout of any kind in
      the fetch path, so one stalled read wedged a worker forever. Three
      defences now: a socket-level default timeout in every ingest worker, a
      SIGALRM deadline around each ingest attempt that turns a hang into an
      ordinary retryable failure, and a whole-stage deadline that terminates a
      blackholed pool and publishes partial coverage — a partial current cycle
      beats a perfect three-day-old one. The watchdog was NOT livelocked: its
      concurrency guard correctly saw a run always in flight and declined,
      which is the guard working while the runs themselves were the failure.
      The boxes were irrelevant — the HAFS worker lane is profile-gated off
      and the manifest shows only cron writes. And the reason nobody was
      alerted across three incidents: the freshness monitor's HAFS entry still
      carried a known-down silencer from incident one, so it could never
      alarm. The silencer is removed and alerting now ESCALATES — a product
      that stays stale re-alarms every six hours until it recovers, instead
      of one missable email per incident. The re-armed monitor immediately
      surfaced a fourth silent staleness: cyclolab analogs, stale since
      Jul 16 with its workflow failing.
  - id: models-keyboard-layer
    title: Expert keyboard layer — run trend on up/down, WCAG-compliant
    area: models
    status: shipped
    date_shipped: 2026-07-31
    note: >-
      Left/right for forecast hour is universal across the class; UP/DOWN for
      RUN TREND is the analyst move nobody else ships — hold one valid time
      fixed and watch how the forecast for that moment changed across
      successive inits. The hour arithmetic is exact (valid = init + fxx, so
      stepping to the 6-hour-older run lands on fxx+6), the move is narrated
      in a transient notice, and a run that lacks the exact valid time shows
      the nearest frame and says so rather than switching silently. Space
      plays and pauses, Home/End jump to the first and last rendered hour,
      Esc pauses or closes the sheet, and ? opens the shortcut sheet. WCAG
      2.1.4: the single-character keys (Space, ?) sit behind a persisted
      toggle in the sheet — arrows and function keys are not character keys
      and stay active — and a visible Shortcuts button means turning them off
      can never lock the sheet away. Keys fire only while the viewer is on
      screen and never while typing in a control. All browser-proven,
      including the toggle actually disabling Space.
