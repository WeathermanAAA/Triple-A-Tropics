  - id: leg-precedence-correction
    title: Precedence corrected — the b-deck REVISES, tcvitals is frozen at issuance
    area: obs
    status: shipped
    date_shipped: 2026-07-30
    note: >-
      The first cut of resolve_conflicts ranked the real-time legs above the
      b-deck inside the revision window, on the reading that the deck mirror
      lags. Three hours of live data falsified that. Measured on 12W between
      03:16Z and 06:31Z, the deck moved 18Z from 140 to 150 kt / 909 mb and 00Z
      from 140 to 145 / 917, while tcvitals never moved off 145 / 915 and
      140 / 921 at those same hours. tcvitals is a ONE-SHOT record frozen at
      warning issuance; the deck is the only JTWC source that self-corrects,
      and knackwx tracks the correction (it carried the deck's revised 145 / 917
      at 00Z while tcvitals still said 140 / 921). Ranking a frozen leg above a
      revising one had therefore pinned the site to a stale 145 kt while JTWC's
      own deck said 150 — the same class of under-report the leg was added to
      fix, in the opposite direction. The table is now ordered by whether a
      source revises: knackwx, then the deck, then tcvitals, then the warning
      text. The frozen legs still lead where the deck has not reached an hour at
      all, which is a gap rather than a disagreement. A new test asserts no
      untyped leg can outrank a typed one, because that invariant is what keeps
      the nature-inheritance guard from being load-bearing. Dolphin now reads
      its revised peak, 150 kt / 909 mb, and knackwx supplies the 06Z fix the
      deck has not published yet — the leg genuinely leading rather than only
      filling gaps.
    links:
      - label: WPac tracks
        url: /climatology/west-pacific/tracks/
  - id: knackwx-leg-and-conflict-resolution
    title: A fourth intensity leg, and legs that can LEAD rather than only fill gaps
    area: obs
    status: shipped
    date_shipped: 2026-07-30
    note: >-
      Dolphin sat at 140 kt / 921 mb while every other site had 145 / 915. The
      number was never missing and no new source was needed to find it: tcvitals
      carried 2026-07-29 18Z at 145 kt / 915 mb, the b-deck carried the same hour
      and the same position at 140 / 921, and prefer_bdeck discarded the tcvitals
      row because the deck always won a shared hour. The deck had 18Z by 19:22Z
      while tcvitals still stopped at 12Z, so tcvitals published that hour LATER
      and higher. Two changes. RyanKnack's api.knackwx.com/atcf/v2 becomes a
      fourth leg for DESIGNATED storms (the repo already used it for invests, and
      that code's docstring left designated systems explicitly unconfirmed — they
      are listed); it is one fix per storm, the current analysis only, so it can
      lead the leading edge but can never fill a past hour, and it is the only
      live leg that is self-typing because the payload carries the ATCF dev
      level. And resolve_conflicts replaces deck-always-wins with a documented
      precedence — knackwx, then tcvitals, then the warning text, then the deck
      — for fixes inside a 48 h revision window, with the deck taking settled
      hours back as post-analysis. One row per (SID, synoptic hour) comes out
      however many legs saw the fix, so ACE cannot double-count. The subtle part
      is nature: tcvitals has no dev-level field, and an untyped winner replacing
      a typed deck row silently drops the fix from ACE — measured at storm ACE
      12.460 falling to 2.805 with the track still looking healthy — so nature is
      inherited from a typed peer independently of the wind guard that stops a
      915 mb reading being stapled onto a 140 kt analysis. Dolphin now reads
      145 kt / 915 mb / C5, peak ACE 12.460 -> 12.602 (+0.1425 exact before the
      3 dp rounding policy), WP season 143.395 -> 143.537, one storm changed of
      570. AL/EP are untouched by construction — the whole live path is gated on
      basin_cfg tcvitals, which is False for both.
    links:
      - label: WPac tracks
        url: /climatology/west-pacific/tracks/
  - id: jtwc-warning-fix-leg
    title: The warning text becomes a FIX source, not just a type source
    area: obs
    status: shipped
    date_shipped: 2026-07-29
    note: >-
      Third recurrence of "our intensity trails everyone else" (100-vs-125, then
      failing to lead on 125, then C4-vs-C5 on Dolphin). Diagnosed rather than
      patched this time. Ground truth for 12W at 2026-07-29 19:07Z: the b-deck
      mirror and the machine-readable ATCG bulletin both sat at 06Z/120 kt while
      tcvitals and the prose warning both had 12Z/130 kt — so the leading edge
      was b-deck-union-tcvitals, and whenever tcvitals lagged a cycle the site
      fell back to a 13-hour-old b-deck fix even though JTWC's current analysis
      was sitting in a text bulletin we were already downloading and parsing for
      the storm type alone. parse_prose now also reads the analysis position,
      1-min wind and all three radii thresholds; a DDHHMM with no month or year
      is resolved against the ATCG twin's full synoptic stamp (no anchor, no
      fix — that is the stale-slot defence), and when the prose resolves NEWER
      it supersedes the ATCG numbers wholesale, never a 12Z position wearing 06Z
      radii. The leg is strictly additive: b-deck beats tcvitals beats warning at
      a shared (SID, hour), so it only ever fills an hour nothing else reaches
      and cannot double-count into ACE. Warning fixes carry no MSLP (neither
      bulletin family publishes it), which is exactly why they lose ties.
      Verified byte-identical on --no-live for all three basins, and on captured
      live inputs the output is unchanged when tcvitals is current while the
      lagging case recovers one fix worth exactly 130^2/10^4 = 1.690 ACE.
    links:
      - label: WPac tracks
        url: /climatology/west-pacific/tracks/
  - id: fleet-conventions
    title: Fleet conventions for multi-box operation
    area: infra
    status: shipped
    date_shipped: 2026-07-25
    note: >-
      Box 2 arrived, so the conventions went in while the fleet was still small
      enough to change cheaply. fleet.yml is the inventory AND the lane-to-box
      assignment map; scripts/fleet.sh is the one entry point (status, drift,
      provision, deploy, setenv, lanes). Git rule is fleet-wide and mechanical -
      every box tracks origin/main only, and drift is reported as an incident
      rather than tolerated as a state. provision_box.sh makes box N+1 a step
      instead of a bespoke build, and anything a future box needs goes in it so
      box N+2 inherits the fix. Secrets stay in each box's .env with one
      command to roll a credential fleet-wide. Documented in RUNBOOK-FLEET.md.
    links:
      - label: Fleet health
        url: /fleet/
  - id: fleet-health-page
