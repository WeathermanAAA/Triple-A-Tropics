        url: https://cdn.triple-a-tropics.com/ships/index.json
  - id: storm-diagnostic-plate
    title: Storm diagnostic plate — the four panels as one copy-pasteable PNG
    area: satellite
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      The pieces existed as separate products, which is fine for a page and
      wrong for a post — showing someone a storm meant handing them three
      images and explaining how they line up. One 2x2 PNG under one header
      carrying storm, intensity, valid time and forecast hour. Top row is the
      IR window twice, grayscale with BD-step contours and every centre
      estimate keyed, then the same scene enhanced with the extremes tagged IR
      / WV / SWIR. Bottom-left is the CycloLab wind/pressure/ACE chart,
      CAPTURED from the real renderer rather than ported — its ACE projection
      regrids forecast intensity onto the 6-hourly synoptic grid and resumes
      from the latest observed fix, and a matplotlib copy of that would keep
      drawing plausible curves while drifting. Bottom-right is eye structure —
      a radial IR profile with the BD ladder behind it and the ADT-style eye
      score, warmest eye pixel against the coldest eyewall ring. A pixel COUNT
      was the other candidate and was rejected on its merits: it is
      resolution-dependent, so the same eye counts differently on 2 km ABI
      than on a 4 km reprojection. The score is withheld, with the reason
      named, when the method's own scene classifier says there is no eye —
      live 12W reported 16.8 C off a "warmest eye pixel" of -62.5 C under a
      UNIFORM CDO before that gate went in. The two-panel plot keeps
      publishing to its own key; the plate is additive.
    links:
      - label: CycloLab
        url: /cyclolab/
  - id: poller-deck-sweep-latency
    title: Live feed latency — the deck sweep stopped paying for storms that do not exist
    area: obs
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      Dolphin's 28/18Z fix (125 kt / 937 mb) reached the b-deck at 19:13:54Z and
      the site at 19:19Z. Five of those minutes were ours, on every advisory in
      every basin. The box intensity poller walks a mirror chain per storm
      number and was giving EACH mirror the full retry policy, four attempts on
      a 2/4/8 s backoff, before trying the next one. That defeats the point of
      having a second mirror, and it turned expensive because our own ATCF proxy
      Worker answers an upstream 404 with a 502, so the three consecutive
      absences that END each basin's sweep burned the whole retry budget every
      cycle. Measured on the box against the live chain, 100.4 s for WP, 57.3 s
      for AL, 113.0 s for EP, 270.7 s per cycle of pure backoff, which is why
      the poller's real period was ~7.2 min against a configured 120 s. The
      chain is now walked with retries OFF and escalated to the full policy only
      when NOTHING in it answered, so a genuine outage still gets the budget
      while an absent storm number costs one request per mirror. Same sweep in
      4.4 s, 61x, and the frames compare identical in all three basins. The
      tcvitals leg was firing correctly throughout and had nothing to add here
      because the b-deck led it this cycle.
    links:
      - label: WPac tracks
        url: /climatology/west-pacific/tracks/
  - id: ships-diagnostics-panel
    title: SHIPS diagnostic panel from the NHC stext feed
    area: models
    status: next
    note: >-
      Specced against the live feed (283 files harvested). Filename is
      YYMMDDHH + basin + number + a TWO-digit storm year, not four. AL/EP/CP
      only — there are no JTWC-basin SHIPS files, matching the a-deck picture.
      Every columnar block is fixed-width and must be sliced rather than
      split: two contribution labels are exactly 22 chars and butt against the
      first data cell. TOTAL CHANGE equals the sum of its 19 components
      exactly across 283 files times 16 columns, so the decomposition renders
      as a waterfall safely. Sentinels are row-specific. The 4-digit year in
      the banner is the COEFFICIENT year, and the RI predictor table's labels,
      ordering and column offsets all change between coefficient years and
      between basins — key it by label string, never by row position. Two
      corrections to the original premise: RHLO and RHHI are NOT in the stext
      bulletin, only 700-500 mb RH is, so the low and high RH rows need the
      1:1 lsdiag sibling; and there is no archive for either feed anywhere on
      the NHC FTP, so a historical panel requires continuous harvesting from
      now. Test decks with cyclone numbers 80-89 carry absurd values and must
      be filtered.
  - id: guidance-viewer-component
    title: Model guidance viewer — spaghetti, OCD5 baseline, membership strip, early/late
    area: models
    status: shipped
    date_shipped: 2026-07-28
    note: >-
      The guidance layer lands on CycloLab, the storm-keyed surface, as ONE
      component in the main repo that the per-storm shell lazy-loads — the same
