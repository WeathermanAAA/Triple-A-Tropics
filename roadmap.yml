  - id: atcf-proxy-404
    title: ATCF proxy Worker should answer an absent deck with 404, not 502
    area: infra
    status: needs-andrew
    note: >-
      The Worker collapses "upstream says this file is absent" into "upstream
      failed" and returns 502 where natyphoon and ftp.nhc both return a clean
      404. Every consumer then correctly treats it as transient and retries with
      backoff, so discovering that storm number 13 does not exist costs ~30 s
      instead of ~1 s. The poller is now immune either way (see
      poller-deck-sweep-latency), but the 6-hourly cron generators still sweep
      the same chain and still pay it. Blocked on Andrew because the Worker's
      source lives only in the Cloudflare dashboard and has never been
      back-vendored into workers/, which is the second half of this item.
