  - id: hafs-ingest-memory
    title: HAFS ingest memory rework — parent-frame peak 3.64 GB → 1.96 GB, byte-identical
    area: models
    status: shipped
    date_shipped: 2026-07-29
    note: >-
      Profiled the HAFS ingest instead of guessing at it. The peak was not the
      GRIB decode or the cache — it was the MetPy 200 mb PV solve, 1848 MB of a
      3438 MB parent-frame peak, run over a 7-level pressure stack when the
      calculation's 3-point vertical stencil can only see 3 of them; trimming to
      the mapped level plus its two neighbours is bit-identical and provably so.
      Plus the three 17-level layer-mean integrals (level selection now happens
      on the decoded float32 stack and widens once), cfgrib datasets now closed,
      malloc_trim between frames, ingest workers recycled, and a render task now
      reads only the fields its product draws (289 MB, not 908). The float32
      end-to-end idea was tested and REJECTED on evidence — it moves pixels,
      because matplotlib's streamline integrator amplifies a last-ulp dtype
      difference (5.0% of pixels on env_shear_500_850, and 0.8% on hgt_wind_700
      whose values were bit-identical). float32 is kept for pass-through storage
      only and widened at the render boundary. Verified 87/87 PNGs
      byte-identical across 21 products x 5 real frames. Per-worker peak is
      independent of pool width, so the box worker's ingest concurrency doubles
      4 → 8 in the same 24 GB. --ingest-jobs is now a CEILING rather than a bet:
      the builder budgets ~2.3 GB/worker and clamps the width to what the host
      (or container) can hold, so the same command is right on a 7 GB runner, a
      16 GB one and the 24 GB box — the old value had been picked against a
      "7 GB runner" assumption that predates GitHub's public-repo runner upgrade
      and was never re-checked.
    links:
      - label: models
        url: /models/
  - id: tc-records-pipeline-repair
    title: TC records publishing repaired — never succeeded on cron since creation
    area: records
    status: shipped
    date_shipped: 2026-08-07
    note: >-
      The update-tc-records workflow was 0-for-30 since its 07-23 creation
      and NOBODY knew: /records/ serves a 07-29 stamp only because one run's
      partial R2 sync died on a broken pipe mid-publish. Three failure modes
      untangled: (1) dominant — matplotlib/Pillow lazy-imported inside the
      explorer density emit but never installed (the repo's THIRD lazy-import
      episode after analogs' shapely and cartopy → the escalation rule
      applied: FULL pinned dependency sets in both install steps, versions
      from the 2026-08-07 green runner env); (2) since 08-05 — NCEI answering
      instant 403 to every IBTrACS fetch in the cron's GH-lagged 17:15-18:20Z
      band while update-ace's byte-identical fetch succeeds at its :07 slots
      → crons moved to 04:23/04:53Z; (3) one transient broken-pipe publish.
      Full pipeline proven end-to-end locally (rc=0, gate passed, density
      overlays render). The freshness monitor had NO records entry — the
      blind-spot class — one added (records/v1/meta.json, 30 h limit), so
      the currently-9-day-stale product alarms every 6 h until the moved
      cron publishes: the monitor itself now tracks this repair's close.
  - id: azimuthal-mean-structure
    title: Azimuthal-mean structure plate — tangential wind, RMW, warm core, inflow (spec 25)
    area: models
    status: shipped
    date_shipped: 2026-08-07
    note: >-
      The spec's "single most information-dense TC structure diagnostic", as a
      2x2 plate per (model, storm, hour) on the storm view: cyclonic
      tangential wind by level with the RMW and the PARENT 6 km profile
      dashed beside the nest (the resolution caveat DRAWN — for today's broad
      60-68 kt storms the gap is honestly +0.7-0.9 kt, and it will display
      itself when a compact major occurs); radial wind (the -25 kt inflow
      layer visible on Dolphin); warm core as the 850-500 thickness-DERIVED
      mean-layer T anomaly (no T levels in the cache — stated on the plate);
      and the quadrant-max radii rose. One azimuthal-mean implementation:
      the polar core was EXTRACTED from vortex-removed-shear (#26), which
      now imports it — proven by #26's 14 tests passing unchanged on the
      shared operator. RMW/vt-max scalars (nest AND parent) also publish
      per-hour in storms[].structure. First plates render with the next
      cron cycle.
