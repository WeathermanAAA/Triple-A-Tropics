      S1 shadow ingest on box1. Found and fixed same-day: the GOES-18 +
      Himawari-9 SNS subscriptions had died upstream 2026-07-05 (same 5-min
      window; 34 days of 100%-backfill masked by poll-success health) —
      re-created and verified src=sqs on all three lanes; band-tight SNS
      wildcard filters cut deliveries ~97% (goes19 160/5min -> 5/5min,
      exactly the C13 cadence; checker taught wildcard FIRST so acceptance
      could not go blind); delivery-silence health gate (a lane starved 6h
      reports starved/503 while the watchdog stays poll-gated — reporting
      change, not restart change); R2-strict credential guards both repos
      (the codespace's real AWS key could be misrouted to real S3 or shipped
      to Cloudflare from 3 unguarded + 13 fallback sites); DLQ probe 30s ->
      300s; the box-only s1-multisat branch merged to main, box1 repointed,
      fleet.yml + runbook now carry the stack and the incident. Next-day
      confirmation: CloudWatch daily SQS requests should read ~15-20k/day
