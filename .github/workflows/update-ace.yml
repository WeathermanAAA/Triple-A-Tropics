name: Update ACE charts

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-ace
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download latest IBTrACS CSVs
        run: |
          set -euo pipefail
          BASE="https://www.ncei.noaa.gov/data/international-best-track-archive-for-climate-stewardship-ibtracs/v04r01/access/csv"
          for code in WP NA EP; do
            echo "--- Downloading ibtracs.$code.list.v04r01.csv ---"
            curl -fSL --retry 3 --retry-delay 10 \
              -o "ibtracs.$code.list.v04r01.csv" \
              "$BASE/ibtracs.$code.list.v04r01.csv"
            ls -lh "ibtracs.$code.list.v04r01.csv"
          done

      - name: Regenerate West Pacific
        run: python generate_ace_plot.py --basin wp

      - name: Regenerate Atlantic
        run: python generate_ace_plot.py --basin al

      - name: Regenerate East Pacific
        run: python generate_ace_plot.py --basin ep

      - name: Commit and push if anything changed
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wp_ace.html wp_ace_data.json al_ace.html al_ace_data.json ep_ace.html ep_ace_data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh ACE charts ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
