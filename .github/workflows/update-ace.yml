name: Update ACE + Tracks

on:
  schedule:
    # GitHub silently drops scheduled runs during high-load windows,
    # especially on the round-number minute marks (:00/:15/:30/:45).
    # We stagger across off-peak offsets and add a third backup so at
    # least one slot lands even when a whole top-of-hour window gets
    # throttled.
    #
    # Primary: :07 past every 6-hour boundary (00:07, 06:07, 12:07, 18:07 UTC).
    - cron: "7 */6 * * *"
    # Backup 1 (~30 min later). Concurrency group below keeps them
    # from running at the same time; if the primary succeeded, this
    # just redoes the work (no data changes → empty commit skipped).
    - cron: "37 */6 * * *"
    # Backup 2 (~1h46m after primary). Offset from 01/07/13/19 UTC so
    # it lands in a quieter slot entirely outside the hour-boundary
    # contention window.
    - cron: "53 1,7,13,19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-ace
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy
          # ace_core is the single source of truth for ACE numbers AND the
          # ACE/tracks feed-assembly logic (current curve, storms, header,
          # rank). Installing it as a package keeps the generators and the
          # future streaming poller on one identical assembly. Both generators
          # `import ace_core` from the installed package (the ace_core/ subdir
          # at repo root is just the package source; the install wins).
          pip install ./ace_core

      - name: Download latest IBTrACS CSVs
        run: |
          set -euo pipefail
          BASE="https://www.ncei.noaa.gov/data/international-best-track-archive-for-climate-stewardship-ibtracs/v04r01/access/csv"
          for code in WP NA EP; do
            echo "--- Downloading ibtracs.$code.list.v04r01.csv ---"
            curl -fSL --retry 3 --retry-delay 10 \
              -o "ibtracs.$code.list.v04r01.csv" \
              "$BASE/ibtracs.$code.list.v04r01.csv"
            ls -lh "ibtracs.$code.list.v04r01.csv"
          done

      - name: Download Natural Earth basemaps (for tracks pages)
        run: |
          set -euo pipefail
          NE="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson"
          # 50m resolution — shows islands and small coastal features.
          # 110m (lower res) is kept as a fallback if a 50m file fails.
          for f in ne_50m_coastline.geojson ne_50m_admin_0_countries.geojson \
                   ne_110m_coastline.geojson ne_110m_admin_0_countries.geojson; do
            if [ ! -f "$f" ]; then
              echo "--- Downloading $f ---"
              curl -fSL --retry 3 --retry-delay 10 -o "$f" "$NE/$f" || echo "(optional file $f failed — OK)"
            fi
            ls -lh "$f" 2>/dev/null || true
          done

      - name: Regenerate ACE — West Pacific
        run: python generate_ace_plot.py --basin wp

      - name: Regenerate ACE — Atlantic
        run: python generate_ace_plot.py --basin al

      - name: Regenerate ACE — East Pacific
        run: python generate_ace_plot.py --basin ep

      - name: Regenerate Tracks — West Pacific
        run: python generate_tracks_plot.py --basin wp

      - name: Regenerate Tracks — Atlantic
        run: python generate_tracks_plot.py --basin al

      - name: Regenerate Tracks — East Pacific
        run: python generate_tracks_plot.py --basin ep

      # Global composite — runs LAST so the per-basin JSON files
      # already exist on disk. The global step reads those JSONs
      # directly (no IBTrACS / live ATCF refetch) and emits a single
      # /global_tracks.html that the home-page iframe loads.
      - name: Regenerate Tracks — Global composite
        run: python generate_tracks_plot.py --basin global

      - name: Upload global_storms.geojson to R2
        # The MapLibre global page fetches global_storms.geojson at
        # runtime; the file refreshes every 6 h with the ACE workflow.
        # Moved to R2 (cdn.triple-a-tropics.com/global_storms.geojson)
        # in R2 phase 1. The iframed HTML pages stay on origin to
        # preserve same-origin iframe-resize JS; only the geojson
        # data file is fetched cross-origin (CORS allows it).
        #
        # Phase-3 cutover gate (mirrors WRITE_LIVE_FEEDS / RENDER_HAFS_ON_CRON):
        # when the streaming poller is promoted to write the LIVE geojson each
        # cycle (GLOBAL_GEOJSON_KEY=global_storms.geojson on the box poller), set the
        # repo variable WRITE_GLOBAL_GEOJSON_ON_CRON=false so the cron stops
        # overwriting the poller's fresh map with 6h-stale storms. Default
        # (unset) keeps the cron uploading = today's behavior. The Regenerate
        # step above is NOT gated: it still builds the committed
        # global_tracks.html page shell, and the geojson it writes to disk is
        # gitignored. Instant rollback = clear the variable.
        if: vars.WRITE_GLOBAL_GEOJSON_ON_CRON != 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -f global_storms.geojson ]; then
            bash scripts/upload_to_r2.sh global_storms.geojson global_storms.geojson
          else
            echo "(generator did not emit global_storms.geojson — skipping upload)"
          fi

      - name: Upload live ACE + tracks feeds to R2
        # WRITE_LIVE_FEEDS (Piece 3 cutover gate): default ON. Set the repo
        # variable WRITE_LIVE_FEEDS=false at cutover so the intensity poller
        # becomes the SOLE live-feed writer; flip it back to true for INSTANT
        # rollback (the cron resumes live writes, no data loss). The base upload
        # above is NOT gated - the cron always writes the archive base.
        if: ${{ vars.WRITE_LIVE_FEEDS != 'false' }}
        # DUAL-WRITE (Data-Accuracy Fix 2, Piece 2): publish the live
        # per-basin ACE + tracks JSON feeds to
        # cdn.triple-a-tropics.com/feeds/ IN ADDITION TO the git commit
        # below. The frontend reads them cross-origin from there so the
        # upcoming streaming-intensity poller (Piece 3) can refresh them
        # without a git commit per update — constant commits would
        # re-bloat .git and fight Pages' rebuild lag. The git-commit path
        # stays live during the transition (belt-and-suspenders); do NOT
        # remove it here. Content-Type application/json (file(1) would
        # otherwise tag these text/plain) + short max-age=30 because the
        # poller is about to churn them far faster than every 6 h.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          for f in wp_ace_data.json al_ace_data.json ep_ace_data.json \
                   wp_tracks_data.json al_tracks_data.json ep_tracks_data.json; do
            if [ -f "$f" ]; then
              echo "--- Uploading $f -> feeds/$f ---"
              bash scripts/upload_to_r2.sh "$f" "feeds/$f" "public, max-age=30" "application/json"
            else
              echo "(generator did not emit $f — skipping upload)"
            fi
          done

      - name: Build + upload archive feed base to R2
        # ADDITIVE (Data-Accuracy Fix 2, Piece 3): write the slow-moving archive
        # base to cdn.triple-a-tropics.com/feeds/base/ so the streaming intensity
        # poller (tat-satellite-render) can merge fresh live b-decks onto it and
        # refresh the feeds within minutes. This does NOT change the live feeds
        # the cron still writes above (no cutover). R2-only (gitignored, not
        # committed); the poller reads it server-side (no CORS concern).
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          python build_feed_base.py
          for f in feeds/base/*_base.json; do
            [ -f "$f" ] || continue
            key="feeds/base/$(basename "$f")"
            echo "--- Uploading $f -> $key ---"
            bash scripts/upload_to_r2.sh "$f" "$key" "public, max-age=300" "application/json"
          done

      - name: Commit and push if anything changed
        env:
          WRITE_LIVE_FEEDS: ${{ vars.WRITE_LIVE_FEEDS }}
        run: |
          set -eo pipefail
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # WRITE_LIVE_FEEDS=false (Piece 3 cutover): the intensity poller owns the
          # live JSON feeds on R2, so discard their working-tree changes and commit
          # ONLY the HTML charts + basemaps (the base is R2-only). Flip the repo
          # variable back to true to roll back instantly (cron resumes live writes).
          if [ "${WRITE_LIVE_FEEDS:-true}" = "false" ]; then
            git checkout -- wp_ace_data.json al_ace_data.json ep_ace_data.json \
                            wp_tracks_data.json al_tracks_data.json ep_tracks_data.json 2>/dev/null || true
            echo "WRITE_LIVE_FEEDS=false: live JSON feeds NOT committed (poller owns them on R2)."
          fi
          # global_storms.geojson is NOT staged — it lives on R2 now.
          # The iframed *_tracks.html / *_ace.html pages remain on
          # origin (category C in R2 phase 1) so the parent-page
          # iframe-resize JS keeps working same-origin.
          git add wp_ace.html wp_ace_data.json al_ace.html al_ace_data.json ep_ace.html ep_ace_data.json \
                  wp_tracks.html wp_tracks_data.json al_tracks.html al_tracks_data.json ep_tracks.html ep_tracks_data.json \
                  global_tracks.html \
                  ne_50m_coastline.geojson ne_50m_admin_0_countries.geojson \
                  ne_110m_coastline.geojson ne_110m_admin_0_countries.geojson 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh ACE + tracks ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          # Files this workflow regenerates in full on every run. A
          # conflict limited to these is auto-resolvable: every ACE run
          # (and the next scheduled one) overwrites them from scratch, so
          # whichever side we keep is replaced within hours. Conflicts on
          # anything OUTSIDE this list are genuinely ambiguous and need a
          # human — we abort and fail loudly in that case.
          REGEN_FILES=(
            wp_ace.html wp_ace_data.json al_ace.html al_ace_data.json
            ep_ace.html ep_ace_data.json
            wp_tracks.html wp_tracks_data.json al_tracks.html al_tracks_data.json
            ep_tracks.html ep_tracks_data.json global_tracks.html
            ne_50m_coastline.geojson ne_50m_admin_0_countries.geojson
            ne_110m_coastline.geojson ne_110m_admin_0_countries.geojson
          )

          # Rebase-and-push loop. Another push can land on main while this
          # job renders: the SST / subsurface / ARMOR3D workflows (which
          # touch disjoint files), but ALSO another update-ace run — a
          # manual workflow_dispatch racing the scheduled cron, or a
          # backup cron, regenerating these SAME files. When that happens
          # every output file conflicts on rebase, so a plain abort takes
          # the whole run down (and with it any freshly-formed system like
          # a new TD). Both sides are equally-fresh renders, so resolve
          # such conflicts by keeping OUR commit's version (--theirs in
          # rebase terms) and continue; abort only on unexpected paths.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt — fetching + rebasing..."
            git fetch origin main
            if ! git rebase origin/main; then
              conflicted="$(git diff --name-only --diff-filter=U)"
              if [ -z "$conflicted" ]; then
                echo "Rebase failed but no conflicted paths listed." >&2
                git rebase --abort || true
                exit 1
              fi
              echo "Rebase hit conflicts on:"
              echo "$conflicted"
              unresolvable=""
              while IFS= read -r f; do
                match=0
                for allow in "${REGEN_FILES[@]}"; do
                  if [ "$f" = "$allow" ]; then match=1; break; fi
                done
                if [ "$match" -eq 0 ]; then
                  unresolvable="$unresolvable $f"
                fi
              done <<< "$conflicted"
              if [ -n "$unresolvable" ]; then
                echo "Non-regen conflicts — aborting:$unresolvable" >&2
                git rebase --abort || true
                exit 1
              fi
              echo "All conflicts are regenerated outputs — auto-resolving via --theirs."
              while IFS= read -r f; do
                git checkout --theirs -- "$f"
                git add -- "$f"
              done <<< "$conflicted"
              if ! GIT_EDITOR=true git rebase --continue; then
                echo "Rebase --continue failed after auto-resolve." >&2
                git rebase --abort || true
                exit 1
              fi
            fi
            sleep $((attempt * 2))
          done
          echo "Push still failing after 5 attempts." >&2
          exit 1
