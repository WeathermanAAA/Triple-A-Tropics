name: Update ACE + Tracks

on:
  schedule:
    # GitHub silently drops scheduled runs during high-load windows,
    # especially on the round-number minute marks (:00/:15/:30/:45).
    # We stagger across off-peak offsets and add a third backup so at
    # least one slot lands even when a whole top-of-hour window gets
    # throttled.
    #
    # Primary: :07 past every 6-hour boundary (00:07, 06:07, 12:07, 18:07 UTC).
    - cron: "7 */6 * * *"
    # Backup 1 (~30 min later). Concurrency group below keeps them
    # from running at the same time; if the primary succeeded, this
    # just redoes the work (no data changes → empty commit skipped).
    - cron: "37 */6 * * *"
    # Backup 2 (~1h46m after primary). Offset from 01/07/13/19 UTC so
    # it lands in a quieter slot entirely outside the hour-boundary
    # contention window.
    - cron: "53 1,7,13,19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-ace
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download latest IBTrACS CSVs
        run: |
          set -euo pipefail
          BASE="https://www.ncei.noaa.gov/data/international-best-track-archive-for-climate-stewardship-ibtracs/v04r01/access/csv"
          for code in WP NA EP; do
            echo "--- Downloading ibtracs.$code.list.v04r01.csv ---"
            curl -fSL --retry 3 --retry-delay 10 \
              -o "ibtracs.$code.list.v04r01.csv" \
              "$BASE/ibtracs.$code.list.v04r01.csv"
            ls -lh "ibtracs.$code.list.v04r01.csv"
          done

      - name: Download Natural Earth basemaps (for tracks pages)
        run: |
          set -euo pipefail
          NE="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson"
          # 50m resolution — shows islands and small coastal features.
          # 110m (lower res) is kept as a fallback if a 50m file fails.
          for f in ne_50m_coastline.geojson ne_50m_admin_0_countries.geojson \
                   ne_110m_coastline.geojson ne_110m_admin_0_countries.geojson; do
            if [ ! -f "$f" ]; then
              echo "--- Downloading $f ---"
              curl -fSL --retry 3 --retry-delay 10 -o "$f" "$NE/$f" || echo "(optional file $f failed — OK)"
            fi
            ls -lh "$f" 2>/dev/null || true
          done

      - name: Regenerate ACE — West Pacific
        run: python generate_ace_plot.py --basin wp

      - name: Regenerate ACE — Atlantic
        run: python generate_ace_plot.py --basin al

      - name: Regenerate ACE — East Pacific
        run: python generate_ace_plot.py --basin ep

      - name: Regenerate Tracks — West Pacific
        run: python generate_tracks_plot.py --basin wp

      - name: Regenerate Tracks — Atlantic
        run: python generate_tracks_plot.py --basin al

      - name: Regenerate Tracks — East Pacific
        run: python generate_tracks_plot.py --basin ep

      - name: Commit and push if anything changed
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wp_ace.html wp_ace_data.json al_ace.html al_ace_data.json ep_ace.html ep_ace_data.json \
                  wp_tracks.html wp_tracks_data.json al_tracks.html al_tracks_data.json ep_tracks.html ep_tracks_data.json \
                  ne_50m_coastline.geojson ne_50m_admin_0_countries.geojson \
                  ne_110m_coastline.geojson ne_110m_admin_0_countries.geojson 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh ACE + tracks ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
