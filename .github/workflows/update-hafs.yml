name: Update HAFS Model Plots

# HAFS-A/HAFS-B forecast plots for the /models/ page. Renders every active
# storm x {HAFS-A,HAFS-B} x {storm nest, parent domain} x {MSLP + 10 m wind,
# composite reflectivity} x forecast hour for the latest *complete* HAFS cycle,
# then syncs the PNGs + manifest.json to R2. The frontend (models/index.html)
# reads the manifest from cdn.triple-a-tropics.com.
#
# HAFS runs four cycles/day (00/06/12/18Z) and finishes uploading ~6 h after
# each synoptic time. We run ~6 h 53 m after (00→06:53, 06→12:53, 12→18:53,
# 18→00:53) with a backup ~34 min later. The builder resolves the latest cycle
# whose storm-nest run reached f126, so an early run just picks the prior
# complete cycle rather than a half-written one. Non-round minutes per the
# repo's stagger convention; :53 and :27 are clear of every other scheduled
# slot (ACE :07/:37/:53, SST 13:17/13:47, subsurface 14:23/14:53, ARMOR3D
# 14:43/15:13, sub-anim 16:33/17:03, season-gifs 03:23, GIBS 22:07/22:37).
on:
  schedule:
    - cron: "53 0,6,12,18 * * *"
    - cron: "27 1,7,13,19 * * *"
  workflow_dispatch: {}

# Read-only: this workflow commits NOTHING to main (same as update-gibs.yml).
# All output - PNG frames + manifest.json - is synced to R2; the live site
# fetches it cross-origin from cdn.triple-a-tropics.com/models/hafs/.
permissions:
  contents: read

# One HAFS run at a time. Each run fully rebuilds models/hafs/ for the latest
# cycle then syncs (with --delete) to R2; overlapping runs would duplicate the
# same downloads and could race the sync. Don't cancel a run mid-flight - a
# partial sync is worse than waiting.
concurrency:
  group: update-hafs
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # 350 (not 120): with three simultaneous storms the planner emits ~8.5k
    # render tasks + ~516 GRIB ingests per cycle — measured 2026-07-19, every
    # run died at exactly the old 120-min timeout, restarting from scratch on
    # a stateless runner and burning a perpetual runner-hour loop while the
    # cycle never closed (which also kept the external watchdog re-dispatching
    # on its 40-min cooldown). 350 min still clears the 6-h cycle cadence; if
    # a cycle ever exceeds it, cut WORK (storm cap / hafsb skip), not the
    # timeout. A completing run is everything: only completion advances the
    # manifest and quiets the stuck-cycle detector.
    timeout-minutes: 350

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        # The HAFS render stack is now the installable hafs_render package - ONE
        # source of truth, shared verbatim with the tat-satellite-render box
        # render worker (which pins it as a git dependency). It pulls the GRIB
        # stack (herbie-data .idx byte-range subsetting; cfgrib+eccodes decode -
        # the eccodes wheel bundles the binary, no apt; xarray+netCDF4 back the
        # per-fxx field cache; requests drives S3) AND PINS matplotlib==3.9.3 +
        # numpy==2.1.3 so this cron and the worker rasterize identically (the
        # pixel-parity gate is meaningless without matching pins). No cartopy
        # (Natural Earth GeoJSON is bundled in the package as package_data). The
        # in-repo palette/ package provides tat_palettes (rainbow_ir/wv_tat/...).
        run: |
          python -m pip install --upgrade pip
          pip install ./palette ./hafs_render
          # py-spy: stall forensics only. When ingest completions stop, the
          # builder dumps every worker's Python stack alongside /proc state so
          # the NEXT wedge tells us where it blocks (incidents #3/#4 left no
          # evidence). Optional at runtime - a failed install must not gate.
          pip install py-spy || true
          python -c "import cfgrib; print('cfgrib', cfgrib.__version__)"
          python -c "import netCDF4; print('netCDF4', netCDF4.__version__)"
          python -c "import matplotlib, numpy; print('matplotlib', matplotlib.__version__, '| numpy', numpy.__version__)"
          python -m tat_palettes

      - name: Ensure Natural Earth basemap files exist
        # hafs_plot.py reads these from the repo root for coastlines/borders.
        # They are committed, so this is normally a no-op - but match the other
        # rendering workflows and re-fetch if a file ever goes missing.
        run: |
          set -euo pipefail
          NE="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson"
          for f in ne_10m_coastline.geojson ne_10m_admin_0_countries.geojson \
                   ne_50m_coastline.geojson ne_50m_admin_0_countries.geojson \
                   ne_110m_coastline.geojson ne_110m_admin_0_countries.geojson; do
            if [ ! -f "$f" ]; then
              echo "--- Downloading $f ---"
              curl -fSL --retry 3 --retry-delay 10 -o "$f" "$NE/$f" || true
            fi
          done

      # DEAD-MAN CHECK on the cutover gate. RENDER_HAFS_ON_CRON=false stands
      # this cron down so another renderer can own models/hafs. On 2026-07-19
      # it was set while the intended successor -- the box hafs-worker, which
      # is profile-gated OFF and had never been started on any box -- was
      # expected to take over. Neither renderer ran, and /models/ served an
      # 8-day-old cycle as if it were current until a human noticed. The
      # external watchdog DID detect it every 20 min for 8 days and could only
      # log "WOULD dispatch ... [no token]".
      #
      # So the gate is no longer unconditional: if the PUBLISHED manifest is
      # stale, this cron renders regardless of the variable. A half-finished
      # cutover can silence the cron only for as long as something else is
      # demonstrably still publishing.
      - name: Probe published manifest freshness
        id: freshness
        continue-on-error: true
        run: python3 scripts/hafs_manifest_age.py --github-output "$GITHUB_OUTPUT"

      - name: Generate HAFS plots (latest complete cycle)
        # STAGE-3 CUTOVER ROLLBACK GATE: once the box render worker is the
        # sole renderer (Stage 4), set the repo variable RENDER_HAFS_ON_CRON=false
        # to make this cron a no-op - the worker then owns models/hafs. Unset or
        # any other value keeps the cron rendering (the default, and the instant
        # rollback: clear the variable / set it back to true). The render AND the
        # R2 upload are gated together so a disabled cron never half-publishes.
        #
        # RECOVERY OVERRIDE: a workflow_dispatch ALWAYS renders, even when the
        # scheduled cron is gated off (RENDER_HAFS_ON_CRON=false while the box
        # worker is primary). This is the independent backstop the HAFS freshness
        # watchdog (tat-satellite-render ens_watchdog.py) fires when the worker
        # falls behind, and the manual unwedge path - it does NOT re-enable the
        # scheduled cron (which stays governed by RENDER_HAFS_ON_CRON).
        if: github.event_name == 'workflow_dispatch'
          || vars.RENDER_HAFS_ON_CRON != 'false'
          || steps.freshness.outputs.stale == 'true'
        # Resolves the newest cycle whose storm nest reached f126, enumerates
        # its storms from the public bucket, and renders all frames into
        # models/hafs/ with a manifest.json. Off-season (no storms) it writes
        # an empty manifest and exits 0 - the frontend then shows "no runs".
        env:
          HERBIE_DATA: ${{ runner.temp }}/herbie_data
        run: |
          # --ingest-jobs is a CEILING, not a target. A parent .atm env frame
          # peaked at 3.64 GB before the v0.13.0 ingest rework and 1.96 GB after
          # (measured per worker; peak is independent of pool width - 1956 and
          # 1927 MB for two workers at width 2), so the builder budgets ~2.3 GB
          # per worker and clamps the width to what the host can actually hold
          # (_fit_ingest_width, which also honours a container limit).
          #
          # BACK TO 2 PENDING DIAGNOSIS. The runner is confirmed 16 GB class
          # (run 30434658444 logged "ingest width 4 (14972 MB available, room
          # for 6)"), so the guard did NOT clamp and memory was not the limit -
          # but that run's ingest did not finish 430 frames in 5h50m and the job
          # timed out, against 91 min for the SAME 430 frames at width 2 on the
          # previous release. No pool death, no OOM, no failed frames in the log.
          # Width and the v0.13.0 ingest rework changed in the same run, so this
          # returns the width to the last known-good value to separate them; the
          # heartbeat added alongside this will show where the time actually
          # goes. Do not raise this again until a run reports a healthy rate.
          # The render pool stays 4 (CPU-bound, and a render task now
          # materialises only the fields its product draws - 289 MB, not 908).
          python generate_hafs_plots.py --jobs 4 --ingest-jobs 2 --cycle-scoped
          echo "---- rendered frames (cycle-scoped) ----"
          find models/hafs -name '*.png' | wc -l
          echo "---- manifest (v2) ----"
          python -c "import json; m=json.load(open('models/hafs/manifest.json')); print('shape', 'v2' if 'cycles' in m else 'LEGACY', '| cycles', [c['cycle'] for c in m.get('cycles',[])], '| legacy cycle', m.get('cycle'), '| storms', [s['id'] for s in m.get('storms',[])])"

      - name: Upload HAFS plots to R2 (cdn.triple-a-tropics.com/models/hafs/)
        # Gated with the render step (see RENDER_HAFS_ON_CRON above): when the
        # cron render is disabled there is nothing to upload, and skipping the
        # sync leaves the worker's live frames untouched. (workflow_dispatch
        # always renders + uploads - the recovery override; see the render step.)
        if: github.event_name == 'workflow_dispatch'
          || vars.RENDER_HAFS_ON_CRON != 'false'
          || steps.freshness.outputs.stale == 'true'
        # DUAL-WRITER SAFE. The box render worker co-writes models/hafs/ in
        # the SAME v2 layout (cycle-scoped frames {cycle}/... + a v2 manifest with
        # cycles[]). So this cron must NOT clobber it:
        #   1. Frames for THIS cycle only, into models/hafs/{cycle}/, with
        #      --delete SCOPED to that cycle's prefix (prunes within-cycle orphans;
        #      never touches another cycle or the worker's building cycle). NO
        #      --size-only: a cycle's f###.png can reuse a key with new content.
        #   2. Manifest via hafs_render.publish_manifest: read R2 -> never-regress
        #      MERGE the cron's complete cycle into the existing cycles[] -> atomic
        #      If-Match PUT (re-read+retry on a concurrent worker write). An empty
        #      render is a NO-OP (won't clobber the live manifest).
        # No global --delete anywhere. Off-season clearing is the worker's
        # quiescence gate, not this cron. A TOTAL render failure does NOT reach
        # here: the generator exits non-zero when storms were found but nothing
        # rendered, so this step never runs and the prior cycle stays live.
        env:
          # AWS_* names feed the aws CLI (s3 sync); R2_* names feed
          # hafs_render.publish_manifest, which is R2-strict on purpose
          # (no AWS_* fallback — see _r2_client). Same secrets either way.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          SRC=models/hafs
          if [ ! -f "$SRC/manifest.json" ]; then
            echo "No HAFS manifest at $SRC - generator did not produce output."
            exit 1
          fi
          CC="public, max-age=300"
          DST=s3://triple-a-tropics-media/models/hafs/
          CYCLE=$(python -c "import json;print(json.load(open('$SRC/manifest.json')).get('cycle') or '')")
          # 1. Frames for THIS cycle only; --delete scoped to the cycle's prefix.
          if [ -n "$CYCLE" ] && [ -d "$SRC/$CYCLE" ]; then
            aws s3 sync "$SRC/$CYCLE/" "${DST}${CYCLE}/" --endpoint-url "$R2_ENDPOINT" \
              --cache-control "$CC" --content-type "image/png" \
              --exclude "*" --include "*.png" --exclude "*.values.png" \
              --delete --only-show-errors
            # (value planes are container-ONLY members - uploading them
            # per-frame would double the write bill #27 exists to cut)
            # Container blocks (#27): same prefix, own content type. Filters
            # scope --delete to orphan tars only. Dual-publish transition:
            # PNGs keep uploading until a live container cycle verifies, then
            # the PNG include above is dropped (that flip is the write saving).
            aws s3 sync "$SRC/$CYCLE/" "${DST}${CYCLE}/" --endpoint-url "$R2_ENDPOINT" \
              --cache-control "$CC" --content-type "application/x-tar" \
              --exclude "*" --include "*.tar" --delete --only-show-errors
          else
            echo "No cycle frames to sync (off-season or empty render)."
          fi
          # 2. Manifest: never-regress MERGE + atomic If-Match PUT (the worker
          #    co-writes this key). Empty render -> no-op (won't clobber).
          python -m hafs_render.publish_manifest \
            --manifest "$SRC/manifest.json" \
            --bucket triple-a-tropics-media \
            --key models/hafs/manifest.json
