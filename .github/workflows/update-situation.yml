name: update-situation

# Situation Room feed (shadow page /situation/): one JSON per active NHC storm + an index, built from NHC (CurrentStorms
# + advisory KMZs + public advisory text), the ATCF a/b-decks, and the site's own CDN products (microwave, recon,
# GOES-19 shadow IR frame list). R2-only under situation/: contents:read, commits NOTHING, touches no track/ACE/climo
# product. Opening/closing a storm's room = editing situation/rooms.json.
#
# Cadence: every 10 min. GitHub load-sheds crons, so this is the shadow-phase writer only; when the page graduates,
# move it onto the box poller (the tat-overlays pattern) like the other live feeds.
on:
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["situation/rooms.json", "situation/build_situation.py", "situation/storm_bundle.py"]

permissions:
  contents: read

concurrency:
  group: update-situation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build situation bundles
        run: python situation/build_situation.py --out-dir situation_out
      - name: Sync to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          aws s3 sync situation_out/situation/ "s3://triple-a-tropics-media/situation/" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=60" \
            --content-type "application/json" \
            --exclude "*" --include "*.json" \
            --only-show-errors
          echo "Synced $(ls situation_out/situation/*.json | wc -l) situation document(s)."
