name: update-situation

# Situation Room feed (shadow page /situation/): one JSON per active NHC storm + an index, built from NHC (CurrentStorms
# + advisory KMZs + public advisory text), the ATCF a/b-decks, and the site's own CDN products (microwave, recon,
# GOES-19 shadow IR frame list). R2-only under situation/: contents:read, commits NOTHING, touches no track/ACE/climo
# product. Opening/closing a storm's room = editing situation/rooms.json.
#
# Cadence: CONTINUOUS. One job runs situation/live.py for ~175 min, rebuilding every ~20 s and uploading only the
# documents that changed (plus situation/live.json, the heartbeat the page polls). The hourly schedule keeps exactly one
# run queued behind the running one, so when a job ends the next starts within seconds; a dropped cron just means the
# queued run is a little older. A push to the feed code or rooms.json (or a manual dispatch) cancels the running job
# and restarts on the new code at once.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["situation/rooms.json", "situation/build_situation.py", "situation/storm_bundle.py", "situation/live.py", "situation/vis.py", ".github/workflows/update-situation.yml"]

permissions:
  contents: read

concurrency:
  group: update-situation
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (visible imagery decode)
        run: pip install --no-cache-dir numpy h5py pillow
      - name: Live writer (rebuild every ~20 s, publish changes)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION: auto
        run: python situation/live.py --minutes 175 --every 20
