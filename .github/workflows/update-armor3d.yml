name: Update ARMOR3D

# Copernicus Marine ARMOR3D is a *daily*-published product with ~7-10
# day inherent latency — each day CMEMS posts a new file, but the
# valid date is always about a week ago (altimetry ingest + 7-10 day
# assimilation window). So running daily does give us a new map every
# morning; the valid date just creeps forward one day at a time,
# always ~week-old. This matches cyclonicwx's cadence.
#
# We fire at 14:43 UTC every day with a 15:13 UTC backup for the
# occasional CMEMS hiccup on the first attempt. Those times are well
# clear of the SST (13:17/13:47) and Subsurface (14:23/14:53) cron
# slots so the three oceanographic workflows never queue against each
# other.
on:
  schedule:
    - cron: "43 14 * * *"
    - cron: "13 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# One ARMOR3D job at a time. If both cron entries fire in the same
# window or a manual dispatch overlaps, queue rather than race.
concurrency:
  group: update-armor3d
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        # No need for LFS — armor3d_climatology.nc is checked into plain
        # git (~15 MB, well under GitHub's hard size limit).

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # copernicusmarine is the CMEMS Python client; it pulls in
          # xarray + netCDF4 transitively. Pin to the 2.x series — v1
          # is no longer published, and v2 kept the subset() kwargs we
          # use. Upper-bounded at 3.0 to guard against a future major.
          pip install numpy matplotlib netCDF4 xarray requests \
                      "copernicusmarine>=2.1,<3.0"

      - name: Ensure Natural Earth basemap files exist
        run: |
          set -euo pipefail
          NE="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson"
          for f in ne_50m_coastline.geojson ne_50m_admin_0_countries.geojson; do
            if [ ! -f "$f" ]; then
              echo "--- Downloading $f ---"
              curl -fSL --retry 3 --retry-delay 10 -o "$f" "$NE/$f" || true
            fi
          done

      - name: Generate ARMOR3D weekly plots
        # Fetches one weekly slice of ARMOR3D (T at 0-500 m, global,
        # ~8 MB) via the Copernicus Marine subsetter, derives D26 + TCHP,
        # renders 18 regions × (TCHP + D26 + TCHP anomaly + labels) maps
        # plus 4 equatorial cross-sections = ~112 PNGs. Typically runs
        # in 5-9 min on a GH-hosted runner. Anomaly panels + climo
        # overlays are skipped automatically if armor3d_climatology.nc
        # is missing from the repo.
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python generate_armor3d_plots.py

      - name: Upload ARMOR3D PNGs to R2 (cdn.triple-a-tropics.com/armor3d/)
        # PNGs live on R2 — only the small meta JSON still commits.
        # armor3d_climatology.nc stays in git for now: it's a one-shot
        # workflow INPUT (anomaly rendering reads it), not output, and
        # migrating it requires a fetch step here. Deferred to a follow-
        # up. See R2 phase 1.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        # Sync only the PNGs — exclude the meta JSON (committed to git)
        # and the climatology NetCDF (one-shot artifact, won't be in
        # this workspace at all once it's untracked).
        run: |
          set -euo pipefail
          # `sync` uploads every PNG under armor3d/; --exclude defaults
          # to including everything, so we explicitly drop non-PNGs.
          aws s3 sync armor3d/ s3://triple-a-tropics-media/armor3d/ \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=300" \
            --exclude "*" --include "*.png" \
            --size-only \
            --only-show-errors

      - name: Commit and push ARMOR3D metadata to main
        run: |
          set -eo pipefail
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add armor3d/armor3d_meta.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No ARMOR3D metadata changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh ARMOR3D weekly maps ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          # Rebase-and-push loop — same rationale as SST/subsurface
          # workflows. Other workflows can push to main while this job
          # is rendering, so we retry with rebase rather than failing
          # outright. Our commits only touch armor3d/*.png + the meta
          # JSON, so conflicts are effectively impossible.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt — fetching + rebasing..."
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase failed (unexpected conflict)." >&2
              git rebase --abort || true
              exit 1
            }
            sleep $((attempt * 2))
          done
          echo "Push still failing after 5 attempts." >&2
          exit 1
