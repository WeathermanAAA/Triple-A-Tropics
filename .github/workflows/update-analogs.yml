name: update-analogs

# CycloLab "most resembles" analog engine. tropycal loads the best-track archive
# (HURDAT2 for AL/EP/CP, IBTrACS jtwc for WP); WE compute the TSAI point-separation
# ranking (cyclolab_analogs.py) and write cyclolab/{CANONICAL_SID}/analogs.json +
# the archive picker index/track to R2. ace_core is untouched. R2-only: commits
# nothing to main; last-known-good stays live on any failure.

on:
  schedule:
    # Active storms (lead-time mode) refreshed a few times a day; staggered
    # non-round minutes + a backup, per the repo's scheduled-workflow convention.
    - cron: "37 */6 * * *"
    - cron: "7 */6 * * *"     # backup +30 min
  workflow_dispatch:
    inputs:
      storm:
        description: "Specific storm_id(s), space-separated (e.g. AL032009 NHC_AL042007)"
        default: ""
      archive:
        description: "Basin to backfill once (AL/EP/CP/WP)"
        default: ""
      years:
        description: "Season range for --archive, e.g. '2007 2024'"
        default: ""

permissions:
  contents: read            # R2-only product; commits nothing to main

concurrency:
  group: update-analogs     # serialize the growing-union index write
  cancel-in-progress: false

jobs:
  analogs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        # tropycal is the track/intensity data engine (pulls pandas/numpy/scipy/
        # matplotlib). setuptools<81 restores pkg_resources, which tropycal's
        # version probe imports (removed in newer setuptools) - without it the
        # import fails on the runner.
        # shapely is a REQUIRED runtime dep of the analog build (tropycal's
        # track geometry path imports it lazily, so `import tropycal` alone
        # doesn't prove it) — without it every storm fails with
        # ModuleNotFoundError and, before the fail-loudly guard in
        # generate_analogs.py, the run still showed green (found 2026-07-16:
        # 'wrote 0 storm(s)' for days).
        # cartopy is the SECOND lazy-import episode in this same step
        # (found 2026-08-04, after an 18-day outage): tropycal imports it
        # lazily on the WP/IBTrACS path but not on AL/EP, so the break
        # armed itself the day a WP storm went active (JTWC_WP122026,
        # ~2026-07-16) and every scheduled run since died at import.
        # ESCALATION RULE: a third lazy-import episode here means we stop
        # patching modules one at a time and pin tropycal's full dependency
        # set instead.
        run: |
          python -m pip install --upgrade pip
          # PINNED FULL SET (escalation rule, 2026-08-07): this install step
          # produced THREE lazy-import/dep episodes - shapely (07-16, silent
          # 0-of-N greens), cartopy (08-04, the 18-day WP outage), and the
          # rule says a third episode means pinning the whole set, not
          # patching another module. Versions = the 2026-08-07 green runs
          # (matches the runner env that actually works). Bump deliberately,
          # never implicitly.
          pip install "setuptools<81" \
            tropycal==1.5 shapely==2.1.2 cartopy==0.25.0 \
            matplotlib==3.11.1 numpy==2.4.6 pandas==3.0.5 \
            scipy==1.17.1 pillow==12.3.0 requests==2.34.2
      - name: Build analogs
        env:
          ANALOGS_ENABLED: ${{ vars.ANALOGS_ENABLED || '1' }}
          ANALOGS_STORM: ${{ github.event.inputs.storm }}
          ANALOGS_ARCHIVE: ${{ github.event.inputs.archive }}
          ANALOGS_YEARS: ${{ github.event.inputs.years }}
        run: |
          set -euo pipefail
          ARGS="--out-dir ./analogs_build"
          # Default (scheduled) run = active storms in lead-time mode. A dispatch
          # with --storm/--archive runs that instead (backfill / one-off).
          if [ -z "${ANALOGS_STORM}" ] && [ -z "${ANALOGS_ARCHIVE}" ]; then
            ARGS="$ARGS --active"
          fi
          if [ -n "${ANALOGS_STORM}" ];   then ARGS="$ARGS --storm ${ANALOGS_STORM}"; fi
          if [ -n "${ANALOGS_ARCHIVE}" ]; then ARGS="$ARGS --archive ${ANALOGS_ARCHIVE}"; fi
          if [ -n "${ANALOGS_YEARS}" ];   then ARGS="$ARGS --years ${ANALOGS_YEARS}"; fi
          python generate_analogs.py $ARGS
      - name: Sync to R2 (cdn.triple-a-tropics.com/cyclolab/)
        # Growing union: NO --delete (prior storms' analogs.json / archive tracks
        # stay live). Sentinel manifest.json gates the sync; no manifest -> skip,
        # last-known-good stays live.
        if: ${{ vars.ANALOGS_ENABLED != 'false' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ ! -f ./analogs_build/manifest.json ]; then
            echo "analogs: no manifest written - skipping R2 sync (last-known-good stays live)"
            exit 0
          fi
          aws s3 sync ./analogs_build "s3://triple-a-tropics-media/cyclolab" \
            --endpoint-url "$R2_ENDPOINT" --no-progress \
            --content-type "application/json" --cache-control "public, max-age=300" \
            --only-show-errors
