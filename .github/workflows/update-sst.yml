name: Update SST

# OISST v2.1 has a ~24-hour latency from NOAA NCEI, so we update once
# per day well after that window. Previously scheduled at 13:00 UTC
# exactly, but GitHub silently drops top-of-hour cron runs during
# high-load windows. Offset to :17 and add a backup at :47. Concurrency
# group below dedupes if both fire.
on:
  schedule:
    - cron: "17 13 * * *"
    - cron: "47 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Only one SST workflow at a time. If a run is in progress when the next
# cron fires, queue the new one instead of racing.
concurrency:
  group: update-sst
  cancel-in-progress: false

# ----------------------------------------------------------------------
# Why this is split into two jobs
# ----------------------------------------------------------------------
# Per CLAUDE.md SST animator gotchas: the animation pipeline grew from 4
# product families (~2.5 h cold render) to 8 (~5–6 h cold render) as new
# CRW + records overlays landed. A single job kept hitting the GitHub
# Actions 6-hour hard timeout, which kills the post-step `Save animation
# frame cache` and creates a self-reinforcing failure loop (every run
# starts cold).
#
# The split gives each shard its own 6 h budget:
#   * Job 1 renders the four OISST-family products and saves the cache.
#     Static SST PNGs are committed to main first, so they update even
#     if the OISST shard later trips up.
#   * Job 2 inherits Job 1's cache (warm OISST), cold-renders the four
#     CRW-family products, encodes ALL 144 MP4s in one consolidated
#     pass (so the manifest is unified), and force-pushes to the
#     `mp4-artifacts` orphan branch.
#
# Bootstrap (cache cold for both shards) is ~3 h + ~3 h. Steady-state
# (cache warm) is ~5 min + ~5 min.

jobs:
  static-and-render-oisst:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Minimal plotting stack — no cartopy. We draw coastlines from
          # the Natural Earth GeoJSON the tracks workflow already caches.
          # Pillow is needed by the animation step below for poster JPGs.
          pip install numpy matplotlib netCDF4 requests Pillow

      - name: Ensure Natural Earth basemap files exist
        run: |
          set -euo pipefail
          NE="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson"
          for f in ne_50m_coastline.geojson ne_50m_admin_0_countries.geojson \
                   ne_110m_coastline.geojson ne_110m_admin_0_countries.geojson; do
            if [ ! -f "$f" ]; then
              echo "--- Downloading $f ---"
              curl -fSL --retry 3 --retry-delay 10 -o "$f" "$NE/$f" || true
            fi
          done

      - name: Generate SST plots
        # Pulls ~280 NetCDF files total: ~45 OISST + ~235 CRW (CRW now
        # computes its own 1991–2020 baseline from historical SST files
        # rather than consuming NOAA's pre-baked SSTA product, so it
        # also fetches 30 years × 6 extra DOYs for the change-map and
        # running-mean window-center climatologies). Renders 108 PNGs
        # (18 regions × 3 variants × 2 products). Typically takes
        # 20–35 min on a GH-hosted runner.
        run: python generate_sst_plots.py

      - name: Update SST climatology cache + render curves
        # Kouya-style daily-SST climatology curves, one PNG per region.
        # Decoupled from the maps (continue-on-error) so a climatology
        # hiccup never blocks the SST maps publish below. Seeds the
        # per-region daily-mean cache from R2 (public read — the deep
        # 1982-present history is built once by build-sst-climatology.yml),
        # appends the latest OISST day (cache hit from the plots step
        # above — same NetCDF), and renders the 18 curve PNGs into sst/,
        # which the next step's dir sync sweeps to R2. The updated cache
        # is an R2 build INPUT, never committed; we re-upload it here.
        # Until the backfill has run, the curves render thin (recent
        # years only) but harmlessly.
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -eo pipefail
          mkdir -p _sst_clim_build
          CACHE=_sst_clim_build/sst_region_daily_means.npz
          if curl -fsSL "https://cdn.triple-a-tropics.com/sst/sst_region_daily_means.npz" -o "$CACHE"; then
            echo "Seeded cache from R2 ($(stat -c%s "$CACHE") bytes)."
          else
            echo "No R2 cache yet — rendering thin curves until backfill runs."
            rm -f "$CACHE"
          fi
          python generate_sst_climatology.py --update
          echo "Publishing updated cache (build input) to R2..."
          bash scripts/upload_to_r2.sh "$CACHE" sst/sst_region_daily_means.npz

      - name: Upload SST PNGs to R2 (cdn.triple-a-tropics.com/sst/)
        # The PNGs are no longer committed to main — they live on R2
        # behind the CDN. The small *_meta.json files DO still commit
        # (frontend widgets fetch them from origin). See R2 phase 1.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: bash scripts/upload_to_r2.sh sst sst

      - name: Commit and push SST metadata to main
        # Only the small meta JSONs go to git now; the PNGs are on R2.
        # We still commit BEFORE the animation render so meta updates
        # land even if the OISST cold render later hits the 6-hour
        # timeout. Only this step pushes to main — the animation steps
        # push to the orphan `mp4-artifacts` branch in Job 2.
        run: |
          set -eo pipefail
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sst/sst_meta.json sst/crw_meta.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No SST metadata changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh SST maps ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          # Metadata files the SST generators rewrite in full on every
          # run. Rebase conflicts limited to these paths are auto-
          # resolvable: every scheduled run overwrites them from
          # scratch, so whichever side we pick is thrown away within
          # a day. Conflicts on anything OUTSIDE this list (unexpected
          # changes to code/data) are genuinely ambiguous and need a
          # human — we abort and fail loudly in that case.
          META_FILES=(
            sst/sst_meta.json
            sst/crw_meta.json
          )

          # Rebase-and-push loop. This workflow takes 10+ minutes to run,
          # so commits on main from other sources (you, or the ACE
          # workflow) are very likely to land while we're rendering.
          # Instead of failing outright, fetch their work, replay our
          # commit on top, and push again. Metadata-only conflicts get
          # auto-resolved via the --theirs block below; anything else
          # aborts the rebase.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt — fetching + rebasing..."
            git fetch origin main
            if ! git rebase origin/main; then
              conflicted="$(git diff --name-only --diff-filter=U)"
              if [ -z "$conflicted" ]; then
                echo "Rebase failed but no conflicted paths listed." >&2
                git rebase --abort || true
                exit 1
              fi
              echo "Rebase hit conflicts on:"
              echo "$conflicted"
              unresolvable=""
              while IFS= read -r f; do
                match=0
                for allow in "${META_FILES[@]}"; do
                  if [ "$f" = "$allow" ]; then match=1; break; fi
                done
                if [ "$match" -eq 0 ]; then
                  unresolvable="$unresolvable $f"
                fi
              done <<< "$conflicted"
              if [ -n "$unresolvable" ]; then
                echo "Non-metadata conflicts — aborting:$unresolvable" >&2
                git rebase --abort || true
                exit 1
              fi
              echo "All conflicts are metadata files — auto-resolving via --theirs."
              while IFS= read -r f; do
                git checkout --theirs -- "$f"
                git add -- "$f"
              done <<< "$conflicted"
              if ! GIT_EDITOR=true git rebase --continue; then
                echo "Rebase --continue failed after metadata auto-resolve." >&2
                git rebase --abort || true
                exit 1
              fi
            fi
            sleep $((attempt * 2))
          done
          echo "Push still failing after 5 attempts." >&2
          exit 1

      # --------------------------------------------------------------
      # Animation pipeline — OISST shard (DECOUPLED: render + ENCODE +
      # PUBLISH)
      # --------------------------------------------------------------
      # This shard now renders AND encodes AND publishes the four OISST
      # products itself, so the OISST animation reaches the same latest day
      # as the static OISST maps EVERY cycle — it no longer waits on (or is
      # lost to) the slow CRW shard in Job 2. Job 2 was the only place the
      # animation used to publish, and it kept hitting the GitHub 6-hour
      # job hard-limit (killed mid-CRW-render), so the static maps advanced
      # while the live MP4 + manifest stayed a day (or more) behind.
      #
      # The manifest write is MERGE-safe (generate_sst_animations._write_manifest
      # reads the live manifest and refreshes only THIS shard's product
      # family), so OISST here and CRW in Job 2 never clobber each other.

      - name: Install ffmpeg (OISST encode)
        # ubuntu-latest does not ship ffmpeg; needed now that this shard
        # encodes its own MP4s. Verify on PATH to fail fast.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Restore animation frame cache from R2
        # The ~9.5 GB rolling frame cache lives in R2, NOT the GitHub
        # Actions cache. The old GitHub-cache design saved two ~9.5 GB
        # full-set copies per run (`-oisst` + `-full`); two of them
        # against the 10 GB/repo cache cap evicted each other EVERY run,
        # forcing a ~6 h cold re-render that re-stamped the OISST
        # final/prelim seam (render-once never held). R2 has no cap, so
        # one durable copy persists and render-once finally holds. To
        # force a one-time cold re-render of the whole window, bump the
        # `_vN` suffix in scripts/sst_frame_cache_r2.sh (the R2 analogue
        # of the old `-vN-` key). See SST animator gotchas in CLAUDE.md.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: bash scripts/sst_frame_cache_r2.sh restore

      - name: Render + encode OISST animations + write merged manifest
        # No --render-only: render the OISST frames, encode the 72 OISST
        # MP4s + posters, and write the manifest MERGED with the live one
        # (preserving the CRW clips). Cold start (empty cache) ~2–3 h; warm
        # runs do ~72 new frames + a fast 72-MP4 encode in well under
        # 10 min. The drift guard (::warning::) fires if OISST didn't reach
        # the static latest day.
        run: |
          python generate_sst_animations.py \
            --products actual anomaly anomaly_records anomaly_gmr

      # Persist the OISST-updated frame cache to R2 so Job 2 inherits it
      # (the cross-job handoff) and the next run starts warm. `if: always()`
      # so a later-step failure doesn't lose the rendered frames;
      # continue-on-error so a transient R2 save hiccup (which only costs a
      # cold render next run) never fails the job after the frames rendered.
      - name: Save animation frame cache to R2 (after OISST shard)
        if: always()
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: bash scripts/sst_frame_cache_r2.sh save

      - name: Upload OISST MP4s + manifest to R2 (PRIMARY publish)
        # R2 is the primary source product_animator.js reads. `aws s3 sync`
        # has NO --delete, so this adds/updates the OISST MP4s + the merged
        # manifest and leaves the CRW MP4s in place. Content-types explicit
        # (mp4 / jpeg / json+CORS); manifest skips --size-only so a
        # changed-but-same-size manifest still refreshes.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          SRC=_mp4_build/sst
          if [ ! -d "$SRC" ] || [ -z "$(ls -A "$SRC" 2>/dev/null)" ]; then
            echo "No SST build output at $SRC — nothing to upload."
            exit 0
          fi
          CC="public, max-age=300"
          DST=s3://triple-a-tropics-media/sst/
          aws s3 sync "$SRC" "$DST" --endpoint-url "$R2_ENDPOINT" \
            --cache-control "$CC" --content-type "video/mp4" \
            --exclude "*" --include "*.mp4" --size-only --only-show-errors
          aws s3 sync "$SRC" "$DST" --endpoint-url "$R2_ENDPOINT" \
            --cache-control "$CC" --content-type "image/jpeg" \
            --exclude "*" --include "*.jpg" --size-only --only-show-errors
          aws s3 sync "$SRC" "$DST" --endpoint-url "$R2_ENDPOINT" \
            --cache-control "$CC" --content-type "application/json" \
            --exclude "*" --include "*.json" --only-show-errors

      - name: Push OISST MP4 artifacts to orphan branch (overlay, merge-safe)
        # Fallback publish surface. OVERLAY (no `rm -rf sst`) so this shard's
        # OISST MP4s + merged manifest are added on top of the existing
        # branch contents, preserving the CRW shard's MP4s. Each shard
        # overlays its own family; the merged manifest references both.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/sst_publish_orphan.sh

  render-crw-and-publish:
    runs-on: ubuntu-latest
    needs: static-and-render-oisst

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib netCDF4 requests Pillow

      - name: Ensure Natural Earth basemap files exist
        run: |
          set -euo pipefail
          NE="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson"
          for f in ne_50m_coastline.geojson ne_50m_admin_0_countries.geojson \
                   ne_110m_coastline.geojson ne_110m_admin_0_countries.geojson; do
            if [ ! -f "$f" ]; then
              echo "--- Downloading $f ---"
              curl -fSL --retry 3 --retry-delay 10 -o "$f" "$NE/$f" || true
            fi
          done

      - name: Install ffmpeg
        # ubuntu-latest does NOT ship ffmpeg in its base image. Verify
        # it landed on PATH so we fail fast here rather than ~90 min
        # later at the encode step.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Restore animation frame cache from R2 (warm OISST from Job 1)
        # Job 1's save just overwrote the R2 tar with the freshly rendered
        # OISST frames on top of the prior run's CRW frames, so this restore
        # is the cross-job handoff: OISST warm-skips and only the new CRW
        # delta cold-renders. On miss (e.g. Job 1's save hiccupped) the
        # script leaves _frame_cache empty and the run cold-renders cleanly.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: bash scripts/sst_frame_cache_r2.sh restore

      - name: Render + encode CRW animations + write merged manifest
        # CRW shard ONLY now (--products crw_*): OISST was already rendered,
        # encoded, and PUBLISHED by Job 1, so this job no longer re-encodes
        # the 72 OISST MP4s — it is lighter and likelier to finish inside
        # the 6-hour budget. It cold-renders the four CRW products (~2–3 h
        # bootstrap, ~30 s warm), encodes the 72 CRW MP4s, and writes the
        # manifest MERGED with the live one (preserving Job 1's fresh OISST
        # clips). If this job stalls, the OISST animation Job 1 published is
        # already current; only CRW lags, and the drift guard surfaces it.
        run: |
          python generate_sst_animations.py \
            --products crw_actual crw_anomaly crw_anomaly_records crw_anomaly_gmr

      - name: Save animation frame cache to R2 (full set)
        if: always()
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: bash scripts/sst_frame_cache_r2.sh save

      - name: Upload SST MP4 animations to R2 (cdn.triple-a-tropics.com/sst/)
        # R2 is the PRIMARY source product_animator.js now reads from.
        # The orphan-branch push below is kept as a belt-and-suspenders
        # fallback until live playback from R2 is confirmed (R2 phase 3),
        # then retired. Content-types set EXPLICITLY: video/mp4 (playback
        # + range scrubbing), image/jpeg (posters), application/json (the
        # manifest, fetched cross-origin → needs correct type + CORS).
        # Three passes, one Content-Type each; manifest skips --size-only
        # so a changed-but-same-size manifest still refreshes.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          SRC=_mp4_build/sst
          if [ ! -d "$SRC" ] || [ -z "$(ls -A "$SRC" 2>/dev/null)" ]; then
            echo "No SST build output at $SRC — nothing to upload."
            exit 0
          fi
          CC="public, max-age=300"
          DST=s3://triple-a-tropics-media/sst/
          aws s3 sync "$SRC" "$DST" --endpoint-url "$R2_ENDPOINT" \
            --cache-control "$CC" --content-type "video/mp4" \
            --exclude "*" --include "*.mp4" --size-only --only-show-errors
          aws s3 sync "$SRC" "$DST" --endpoint-url "$R2_ENDPOINT" \
            --cache-control "$CC" --content-type "image/jpeg" \
            --exclude "*" --include "*.jpg" --size-only --only-show-errors
          aws s3 sync "$SRC" "$DST" --endpoint-url "$R2_ENDPOINT" \
            --cache-control "$CC" --content-type "application/json" \
            --exclude "*" --include "*.json" --only-show-errors

      - name: Push CRW MP4 artifacts to orphan branch (overlay, merge-safe)
        # Same shared overlay publisher as Job 1: adds this shard's CRW MP4s
        # + merged manifest on top of the branch (which already has Job 1's
        # fresh OISST), preserving both families. See scripts/sst_publish_orphan.sh.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/sst_publish_orphan.sh
