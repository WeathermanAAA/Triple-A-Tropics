name: Update SST

# OISST v2.1 has a ~24-hour latency from NOAA NCEI, so we update once
# per day well after that window. 13:00 UTC = ~9 AM ET, new file for
# the previous UTC day is reliably posted by then.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Only one SST job at a time. If a run is in progress when the next
# cron fires, queue the new one instead of racing.
concurrency:
  group: update-sst
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Minimal plotting stack — no cartopy. We draw coastlines from
          # the Natural Earth GeoJSON the tracks workflow already caches.
          pip install numpy matplotlib netCDF4 requests

      - name: Ensure Natural Earth basemap files exist
        run: |
          set -euo pipefail
          NE="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson"
          for f in ne_50m_coastline.geojson ne_50m_admin_0_countries.geojson \
                   ne_110m_coastline.geojson ne_110m_admin_0_countries.geojson; do
            if [ ! -f "$f" ]; then
              echo "--- Downloading $f ---"
              curl -fSL --retry 3 --retry-delay 10 -o "$f" "$NE/$f" || true
            fi
          done

      - name: Generate SST plots
        # Pulls ~90 NetCDF files total (45 OISST + 45 CRW for records)
        # and renders 108 PNGs (18 regions × 3 variants × 2 products).
        # Typically takes 15–25 min on a GH-hosted runner.
        run: python generate_sst_plots.py

      - name: Commit and push if anything changed
        run: |
          set -eo pipefail
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sst/*.png sst/sst_meta.json sst/crw_meta.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No SST changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh SST maps ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          # Rebase-and-push loop. This workflow takes 10+ minutes to run,
          # so commits on main from other sources (you, or the ACE
          # workflow) are very likely to land while we're rendering.
          # Instead of failing outright, fetch their work, replay our
          # commit on top, and push again. Our changes touch only
          # sst/*.png + sst/sst_meta.json, so conflicts are nearly
          # impossible in practice.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt — fetching + rebasing..."
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase failed (unexpected conflict)." >&2
              git rebase --abort || true
              exit 1
            }
            sleep $((attempt * 2))
          done
          echo "Push still failing after 5 attempts." >&2
          exit 1
