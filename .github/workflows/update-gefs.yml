name: Update GEFS (Ensemble Genesis Tracks)

# GEFS is the third model on the Ensemble Cyclone Centers platform. UNLIKE ECMWF
# ENS / AIFS-ENS it does NOT self-detect closed lows from MSLP fields: it parses
# NOAA's ensemble GENESIS TRACKER (atcf_gen), which is ALREADY warm-core / TC
# filtered. So this is a LIGHT path - one small ATCF text file per cycle, no GRIB
# download, no field detection, no warm-core compute. It runs in minutes and needs
# only numpy+scipy (pulled in transitively by the shared package import; the GRIB
# stack - cfgrib/xarray/ecmwf-opendata - is NOT installed because GEFS never
# touches a field).
#
# Shares the SAME R2 prefix (models/enscenters/) and the SAME manifest as the
# field models: the merge replaces only the gefs model entry, and build_cycle /
# run_currency re-read the manifest just before merging so the three models'
# separate workflows don't clobber each other's entries. Read-only: commits
# NOTHING to main; per-cycle gefs JSON + the shared manifest sync to R2.
#
# Timing: the NCO genesis tracker posts ~5-6 h after each synoptic cycle, so we
# fire across a generous window 6-9 h after 00/06/12/18Z and let the never-miss
# completeness gate (the genesis file is fetchable) decide when a cycle is
# actually ready. Staggered odd minutes (ecens :19/:49, ecaie :29/:59 -> gefs
# :37/:53) since GitHub drops round-minute crons.

on:
  schedule:
    - cron: "37 6-9,12-15,18-21 * * *"   # 00Z->06-09, 06Z->12-15, 12Z->18-21
    - cron: "37 0-3 * * *"               # 18Z (prev day) -> 00-03
    - cron: "53 9,15,21,3 * * *"         # backup 30 min after each window tail
  workflow_dispatch:
    inputs:
      cycle:
        description: "Force one cycle YYYYMMDDHH (blank = never-miss backfill)"
        required: false

permissions:
  contents: read

concurrency:
  group: update-gefs
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Minutes, not hours: one small genesis ATCF file per cycle, parsed in pure
    # Python. Generous cap for a multi-cycle backfill of tiny files.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          # LIGHT: only numpy+scipy (transitive import of the shared detect/
          # warmcore modules). No GRIB stack - GEFS parses text, never a field.
          python -m pip install --upgrade pip
          pip install numpy scipy
          python -c "import numpy, scipy; print('deps OK')"

      - name: Build GEFS cyclone centers (never-miss backfill)
        env:
          ENS_CYCLE: ${{ github.event.inputs.cycle }}
        run: |
          # --model gefs selects the genesis-track registry spec; the CLI routes
          # it to the light tracks ingest (no GRIB client, no --source/--jobs).
          # --lookback 8 == retain, bounding the completeness gate's per-cycle
          # HEAD probes (nomads-first; an unposted cycle costs one ~8 s ftpprd
          # fallback HEAD, so we cap how many we probe).
          python generate_enscenters.py \
            --model gefs \
            --lookback 8 \
            ${ENS_CYCLE:+--cycle "$ENS_CYCLE"}

      - name: Sync detection JSON + manifest to R2 (and prune old cycles)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          # Atomic, concurrency-safe shared-manifest publish: read live (authoritative
          # R2) -> reconcile this run's build with it per model -> consistency gate ->
          # CAS re-read -> write -> filtered prune. NEVER drops a sibling model, NEVER
          # regresses a model's latest, survives concurrent sibling writes. The whole
          # dance lives in ONE script that all three per-model workflows call (see its
          # header). The active slug for this workflow is `gefs`.
          scripts/enscenters_publish_manifest.sh gefs
