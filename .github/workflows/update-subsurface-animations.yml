name: Update Subsurface Animations

# 90-day daily-cadence MP4 animations for AOML TCHP/D26 + ARMOR3D
# TCHP/D26 + ARMOR3D equatorial cross-sections (actual + anomaly).
#   Map families: 18 regions × 4 = 72 clips
#   Cross-section families: 4 regions × 2 = 8 clips
#   Total: 80 clips per cold run.
# Published to R2 (cdn root, one dir per family) — the `mp4-artifacts`
# orphan branch is retired; R2 is the only publish surface.
#
# Scheduled to fire after the SST (13:17/13:47), Subsurface static
# (14:23/14:53), and ARMOR3D static (14:43/15:13) workflows have had
# time to land — so this runner doesn't queue behind them and so the
# CMEMS NRT slice this animator pulls is the same one the static
# /armor3d/ page just used. Backup at 17:03 catches CMEMS hiccups.
on:
  schedule:
    - cron: "33 16 * * *"
    - cron: "03 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Subsurface animator runs are long (cold ~2-3 h, warm ~5-10 min).
# Queue overlapping triggers rather than racing — each run reads + writes
# the same frame cache + the same R2 family directories.
concurrency:
  group: update-subsurface-animations
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # Default 6 h timeout is enough for a cold render of 4 families
    # (AOML ~1 h via OPeNDAP, ARMOR3D ~3 h via CMEMS chunks). Warm
    # runs finish in single-digit minutes.
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # copernicusmarine drives the ARMOR3D CMEMS subset; xarray +
          # netCDF4 cover both AOML's OPeNDAP and ARMOR3D's NetCDF
          # output. Pillow is needed for the poster JPGs the animator
          # writes alongside each MP4. Pinned copernicusmarine to the
          # 2.x series — same constraint as update-armor3d.yml.
          pip install numpy matplotlib netCDF4 xarray requests Pillow \
                      "copernicusmarine>=2.1,<3.0"

      - name: Ensure Natural Earth basemap files exist
        run: |
          set -euo pipefail
          NE="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson"
          for f in ne_50m_coastline.geojson ne_50m_admin_0_countries.geojson \
                   ne_110m_coastline.geojson ne_110m_admin_0_countries.geojson; do
            if [ ! -f "$f" ]; then
              echo "--- Downloading $f ---"
              curl -fSL --retry 3 --retry-delay 10 -o "$f" "$NE/$f" || true
            fi
          done

      - name: Install ffmpeg
        # ubuntu-latest does not ship ffmpeg in its base image — same
        # gotcha the SST animator workflow documents. Verify it lands
        # on PATH so we fail fast here rather than after a multi-hour
        # cold render.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Restore animation frame cache
        # Monthly key with restore-keys fall-through, same shape as
        # update-sst.yml. Bump the v1 prefix to force a full cold
        # re-render when frame rendering inputs change (cmap stops,
        # FRAME_DPI, etc). The data cache (.subsurface_anim_cache)
        # lives in this same path and is restored alongside the PNGs;
        # the per-day source NetCDFs cost more to re-download than
        # to re-render, so caching them too is the right trade.
        uses: actions/cache@v5
        with:
          path: |
            _frame_cache
            .subsurface_anim_cache
          key: subsurface-mp4-frames-v1-${{ github.run_id }}
          restore-keys: |
            subsurface-mp4-frames-v1-

      - name: Fetch ARMOR3D climatology from R2 (REQUIRED for anomaly cross-sections)
        # armor3d_climatology.nc is a ~56 MiB build INPUT — the 5°S–5°N
        # zonal-mean T climatology read by the anomaly cross-section render.
        # It lives on R2, not in git (.gitignore), and is NOT in the frame
        # cache. Unlike update-armor3d.yml (where a missing climo just
        # downgrades to no-overlay maps), this fetch is FATAL: without it
        # plot_cross_section's mode="anomaly" silently falls back to
        # absolute-T fill, and the render-once frame cache bakes those
        # wrong-but-plausible frames under the anomaly path permanently.
        # `set -e` + `curl -f` + `test -s` => the run fails loud if the
        # climatology can't be fetched, rather than shipping mislabeled data.
        run: |
          set -euo pipefail
          mkdir -p armor3d
          curl -fsSL https://cdn.triple-a-tropics.com/armor3d/armor3d_climatology.nc \
            -o armor3d/armor3d_climatology.nc
          test -s armor3d/armor3d_climatology.nc
          echo "climatology fetched: $(du -h armor3d/armor3d_climatology.nc | cut -f1)"

      - name: Generate subsurface MP4 animations
        # Cold render (empty cache) on first run is ~2.5-3.5 h:
        #   * AOML: 90 OPeNDAP slice fetches + ~3,240 frame renders
        #     = ~60-90 min total (OPeNDAP is the cheap part).
        #   * ARMOR3D: 3 × 30-day CMEMS subsets (~10 min each) +
        #     compute TCHP/D26 per timestep + ~3,240 frame renders
        #     = ~2 h end to end, dominated by CMEMS download time.
        #   * ARMOR3D cross-sections: piggyback on the same CMEMS
        #     fetch (slice the equatorial band out of each chunk) +
        #     ~720 frame renders = ~10-15 min added to ARMOR3D phase.
        # Warm runs do 1 new day per source = 152 new frames + 80
        # MP4 re-encodes ≈ 5-12 min total.
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python generate_subsurface_animations.py

      # Save the cache regardless of whether the publish below
      # succeeds — the rendered frames are the expensive part.
      - name: Save animation frame cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            _frame_cache
            .subsurface_anim_cache
          key: subsurface-mp4-frames-v1-${{ github.run_id }}

      - name: Upload subsurface MP4 animations to R2 (cdn.triple-a-tropics.com)
        # R2 is the ONLY publish surface (the `mp4-artifacts` orphan
        # branch is retired: its daily force-pushes were the repo
        # size-quota eater). Per-family loop: each
        # family that produced build output is synced to its mirrored CDN
        # prefix; a family with no output this run (e.g. ARMOR3D skipped
        # on missing CMEMS creds) leaves its prior R2 copy untouched —
        # sync has no --delete. Content-types set explicitly per ext.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          CC="public, max-age=300"
          upload_family() {
            local fam="$1" src="_mp4_build/$1"
            if [ ! -d "$src" ] || [ -z "$(ls -A "$src" 2>/dev/null)" ]; then
              echo "--- $fam: no local build output, leaving R2 copy in place ---"
              return 0
            fi
            echo "--- uploading $fam to R2 ---"
            local dst="s3://triple-a-tropics-media/${fam}/"
            aws s3 sync "$src" "$dst" --endpoint-url "$R2_ENDPOINT" \
              --cache-control "$CC" --content-type "video/mp4" \
              --exclude "*" --include "*.mp4" --size-only --only-show-errors
            aws s3 sync "$src" "$dst" --endpoint-url "$R2_ENDPOINT" \
              --cache-control "$CC" --content-type "image/jpeg" \
              --exclude "*" --include "*.jpg" --size-only --only-show-errors
            aws s3 sync "$src" "$dst" --endpoint-url "$R2_ENDPOINT" \
              --cache-control "$CC" --content-type "application/json" \
              --exclude "*" --include "*.json" --only-show-errors
          }
          for fam in aoml_tchp aoml_d26 armor3d_tchp armor3d_d26 \
                     armor3d_crosssection_actual armor3d_crosssection_anomaly; do
            upload_family "$fam"
          done

