name: Update Subsurface

# AOML's TCHP/D26 analysis has a ~1-day latency. We refresh once per
# day at 13:30 UTC — 30 minutes after the SST workflow so the two
# commits don't collide, and well past AOML's morning publish cycle.
on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Only one subsurface job at a time. If the previous run is still
# pushing, queue the next one rather than racing for the same files.
concurrency:
  group: update-subsurface
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # xarray + netCDF4 give us OPeNDAP access to AOML's global
          # TCHP/D26 NetCDF. No cartopy — basemap is the same Natural
          # Earth GeoJSON the SST + tracks workflows already use.
          pip install numpy matplotlib netCDF4 xarray requests

      - name: Ensure Natural Earth basemap files exist
        run: |
          set -euo pipefail
          NE="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson"
          for f in ne_50m_coastline.geojson ne_50m_admin_0_countries.geojson; do
            if [ ! -f "$f" ]; then
              echo "--- Downloading $f ---"
              curl -fSL --retry 3 --retry-delay 10 -o "$f" "$NE/$f" || true
            fi
          done

      - name: Generate subsurface plots
        # Fetches just the latest time slice from AOML's OPeNDAP endpoint
        # (~8 MB for both TCHP + D26 at 0.25° global), then renders 18
        # regions × 2 products × 2 variants (clean/labels) = 72 PNGs.
        # Typically takes 2–4 min on a GH-hosted runner — the heavy
        # lifting is matplotlib rendering, not data fetching.
        run: python generate_subsurface_plots.py

      - name: Commit and push if anything changed
        run: |
          set -eo pipefail
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subsurface/*.png subsurface/subsurface_meta.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No subsurface changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh subsurface maps ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          # Rebase-and-push loop. Same rationale as the SST workflow:
          # commits from SST + ACE workflows can land while we render,
          # so retry with rebase rather than failing outright. Our
          # changes only touch subsurface/*.png + subsurface_meta.json,
          # so conflicts are essentially impossible.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt — fetching + rebasing..."
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase failed (unexpected conflict)." >&2
              git rebase --abort || true
              exit 1
            }
            sleep $((attempt * 2))
          done
          echo "Push still failing after 5 attempts." >&2
          exit 1
