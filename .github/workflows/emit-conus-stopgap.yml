# CONUS suite stopgap emitter + geometry-block healer (2026-07-18).
#
# WHY THIS EXISTS: a prior on-demand deep-zoom cut left ONE stray frame at a
# different pyramid geometry (stamp 20260715T202117Z, maxzoom != 5) under 19
# goes19-conus-* products in the cron prefix. The box s2 emit-cron (correctly)
# REFUSES to rebuild those manifests ("would DROP N existing frame(s) at a
# different pyramid geometry") — so 19 CONUS products froze at 2026-07-17
# 02:5xZ while their tiles kept landing. This workflow runs the emitter's own
# designed remediation: a newest-slot conus emit with
# --allow-geometry-change, which rebuilds each manifest around the z5 series
# and drops the stray stamp FROM THE MANIFEST ONLY (no R2 object is deleted;
# the z6 tiles age out via the prune's TTL).
#
# The geometry-freeze half is RESOLVED (box cron carries
# --allow-geometry-change since tsr-s2 @4afdee9); what this workflow provides
# now is CADENCE — a newest-slot conus refresh on top of the box's slow
# multi-hour all-suites rotation. Disable the schedule once the box gives
# conus its own emit lane (see the un-retire note below).
#
# Staggered non-round minutes (repo standard — GitHub sheds :00-family crons).
name: emit-conus-stopgap

# UN-RETIRED 2026-07-18 ~21:3x: the 17:2x retirement assumed the box cron
# gives conus a 10-min cadence. It does not — the box emit-cron runs ALL
# FIVE suites (conus fd himawari9-wpac himawari9-fd geo-global) in ONE
# sequential loop at ~3.5 min/product, so a full rotation takes 4+ h and
# conus refreshes once per rotation (verified in the box logs 21:19Z:
# 4 h into a pass, still inside the fd suite; conus manifests frozen at
# 17:01Z — the LAST stopgap run's slot). The geometry-freeze part IS fixed
# on the box (--allow-geometry-change deployed), but this workflow remains
# the conus CADENCE until the box gets a per-suite lane (queued for Andrew:
# split conus into its own emit-cron service in docker-compose.s2.yml).
# Two staggered crons/hour + no-cancel concurrency ≈ 2 runs/hour after
# GitHub load-shedding (each run ~22-31 min, newest-slot only).
# SCHEDULE RETIRED 2026-08-03 (R2 cost incident): the box conus lanes
# (tat-s2-conus-fast on box2 + conus-fast2/conus on box1) have carried the
# full 28-product suite at native 5-10 min since 2026-07-25 — this lane's
# stated retirement condition. Worse, this workflow checks out s2-sat-ingest
# (frozen 2026-07-21, PRE the 07-25 delimiter-listing fix): each run flat-walks
# every tile key of every retained frame (~1,460 LIST pages for c02 alone),
# ~121k Class A LISTs/day, and since 08-02 every run died at the 65-min
# timeout mid-LIST with ZERO frames published. Its forced --max-zoom 5 emit
# also rebuilds manifests around z5 against the boxes' native z6/z7 conus
# products (the geometry war). workflow_dispatch stays for on-demand re-emits;
# repoint the ref to main before dispatching.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emit-conus-stopgap
  cancel-in-progress: false

jobs:
  emit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout tat-satellite-render (s2-sat-ingest)
        uses: actions/checkout@v6
        with:
          repository: WeathermanAAA/tat-satellite-render
          ref: s2-sat-ingest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps (box parity)
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt

      - name: Emit conus suite, newest slot, geometry-migration allowed
        timeout-minutes: 65
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # no --step: one newest slot per run. --allow-geometry-change is
          # the emitter's own remediation for the stray-frame refusal — it
          # only affects manifest contents, never R2 objects.
          python s2_pyramid_emit.py --suite conus \
            --store r2 --prefix shadow --max-zoom 5 \
            --allow-geometry-change
