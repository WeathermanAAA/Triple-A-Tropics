# CONUS suite stopgap emitter + geometry-block healer (2026-07-18).
#
# WHY THIS EXISTS: a prior on-demand deep-zoom cut left ONE stray frame at a
# different pyramid geometry (stamp 20260715T202117Z, maxzoom != 5) under 19
# goes19-conus-* products in the cron prefix. The box s2 emit-cron (correctly)
# REFUSES to rebuild those manifests ("would DROP N existing frame(s) at a
# different pyramid geometry") — so 19 CONUS products froze at 2026-07-17
# 02:5xZ while their tiles kept landing. This workflow runs the emitter's own
# designed remediation: a newest-slot conus emit with
# --allow-geometry-change, which rebuilds each manifest around the z5 series
# and drops the stray stamp FROM THE MANIFEST ONLY (no R2 object is deleted;
# the z6 tiles age out via the prune's TTL).
#
# IT MUST STAY HOURLY (not one-shot) until the box is fixed: the box cron
# recomputes frame geometry from R2 REALITY each pass, so it keeps refusing
# as long as the stray frames exist. Durable fix = Andrew, ONE of:
#   (a) box: add --allow-geometry-change to the emit-cron command in
#       /root/tsr-s2/docker-compose.s2.yml (one line) and recreate, OR
#   (b) delete the 19 stray-stamp prefixes
#       shadow/sat/goes19/conus/<band>/20260715T202117Z/ from R2.
# After either, DISABLE this schedule (workflow_dispatch stays for re-emits).
# Bonus while it runs: CONUS gets an hourly newest-slot refresh on top of the
# box's slow multi-hour suite pass.
#
# Staggered non-round minutes (repo standard — GitHub sheds :00-family crons).
name: emit-conus-stopgap

# RETIRED 2026-07-18 ~17:2x: the box emit-cron now carries
# --allow-geometry-change itself (tsr-s2 @4afdee9, deployed) — the freeze
# cannot recur and conus freshness is back on the box's 10-min cadence.
# workflow_dispatch kept for on-demand re-emits.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emit-conus-stopgap
  cancel-in-progress: false

jobs:
  emit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout tat-satellite-render (s2-sat-ingest)
        uses: actions/checkout@v6
        with:
          repository: WeathermanAAA/tat-satellite-render
          ref: s2-sat-ingest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps (box parity)
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt

      - name: Emit conus suite, newest slot, geometry-migration allowed
        timeout-minutes: 65
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # no --step: one newest slot per run. --allow-geometry-change is
          # the emitter's own remediation for the stray-frame refusal — it
          # only affects manifest contents, never R2 objects.
          python s2_pyramid_emit.py --suite conus \
            --store r2 --prefix shadow --max-zoom 5 \
            --allow-geometry-change
