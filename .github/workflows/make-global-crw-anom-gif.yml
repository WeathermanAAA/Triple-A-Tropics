name: Make Global CRW Anomaly GIF

# One-off (manually-dispatched) workflow that renders a global Pacific-
# centered CRW SSTA GIF via `generate_global_crw_anom_gif.py`. Data
# source is NOAA Coral Reef Watch's 5 km precomputed SSTA product — one
# file per day, no separate climatology compute required.
#
# The resulting GIF is uploaded as a workflow artifact and is NOT
# committed to the repo (meant for ad-hoc social-media posts, not the
# live website).
#
# To run:
#   Actions → "Make Global CRW Anomaly GIF" → "Run workflow"
# Then, on the completed run page, scroll down to "Artifacts" and
# download `global-crw-anom-gif`. Artifact retention is 14 days.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        default: "2026-01-21"
      end:
        description: "End date (YYYY-MM-DD, inclusive)"
        default: "2026-04-21"
      fps:
        description: "Playback speed (frames per second)"
        default: "8"
      step:
        description: "Day step (1 = daily, 2 = every other day, ...)"
        default: "1"
      colors:
        description: "GIF palette colors per frame (64–256; lower = smaller)"
        default: "128"

permissions:
  contents: read

concurrency:
  group: make-global-crw-anom-gif
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # CRW SSTA fetch for ~90 daily files + matplotlib render loop. The
    # network stage dominates (CDN is fast but each file is ~30–50 MB
    # uncompressed); give it room in case of hiccups.
    timeout-minutes: 90

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # netCDF4 is required to read the CRW NetCDF files.
          # netCDF4 is required to read the CRW NetCDF files. Pin
          # numpy<2 because the netCDF4 wheel on PyPI is still built
          # against numpy 1.x ABI; running against numpy 2.x segfaults
          # during import (SIGSEGV / exit 139).
          pip install "numpy<2" matplotlib netCDF4 xarray requests Pillow

      - name: Download Natural Earth basemaps
        run: |
          set -euo pipefail
          NE="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson"
          # 50 m resolution for crisp coastlines on a global view. The
          # 110 m files are the fallback the generator uses when a 50 m
          # file isn't present.
          for f in ne_50m_coastline.geojson ne_50m_admin_0_countries.geojson \
                   ne_110m_coastline.geojson ne_110m_admin_0_countries.geojson; do
            if [ ! -f "$f" ]; then
              echo "--- Downloading $f ---"
              curl -fSL --retry 3 --retry-delay 10 -o "$f" "$NE/$f" \
                || echo "(optional file $f failed — OK)"
            fi
            ls -lh "$f" 2>/dev/null || true
          done

      - name: Render Global CRW Anomaly GIF
        run: |
          set -eo pipefail
          OUT="global_crw_anom_${{ inputs.start }}_to_${{ inputs.end }}.gif"
          echo "Output file: $OUT"
          python generate_global_crw_anom_gif.py \
            --start  "${{ inputs.start }}" \
            --end    "${{ inputs.end }}" \
            --fps    "${{ inputs.fps }}" \
            --step   "${{ inputs.step }}" \
            --colors "${{ inputs.colors }}" \
            --out    "$OUT"
          ls -lh "$OUT"
          # Stash the exact name so the upload step can find it without
          # having to recompute the template.
          echo "GIF_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Upload GIF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-crw-anom-gif
          path: ${{ env.GIF_PATH }}
          # Short retention — this is a one-off post asset, not a
          # long-lived deliverable. Download it promptly after the run.
          retention-days: 14
          if-no-files-found: error
