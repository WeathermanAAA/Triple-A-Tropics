name: Make Global CRW Anomaly GIF

# One-off (manually-dispatched) workflow that renders a global Pacific-
# centered CRW SSTA GIF via `generate_global_crw_anom_gif.py`. Data
# source is NOAA Coral Reef Watch's 5 km precomputed SSTA product — one
# file per day, no separate climatology compute required.
#
# The resulting GIF is uploaded as a workflow artifact and is NOT
# committed to the repo (meant for ad-hoc social-media posts, not the
# live website).
#
# To run:
#   Actions → "Make Global CRW Anomaly GIF" → "Run workflow"
# Then, on the completed run page, scroll down to "Artifacts" and
# download `global-crw-anom-gif`. Artifact retention is 14 days.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        default: "2026-01-21"
      end:
        description: "End date (YYYY-MM-DD, inclusive)"
        default: "2026-04-21"
      fps:
        description: "Playback speed (frames per second)"
        default: "8"
      step:
        description: "Day step (1 = daily, 2 = every other day, ...)"
        default: "1"
      colors:
        description: "GIF palette colors per frame (64–256; lower = smaller)"
        default: "128"

permissions:
  contents: read

concurrency:
  group: make-global-crw-anom-gif
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # CRW SSTA fetch for ~90 daily files + matplotlib render loop. The
    # network stage dominates (CDN is fast but each file is ~30–50 MB
    # uncompressed); give it room in case of hiccups.
    timeout-minutes: 90

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system libnetcdf / libhdf5
        run: |
          # Ensure netCDF4 binds against the system HDF5 stack rather
          # than a possibly-mismatched bundled copy — fixes SIGSEGV at
          # import time we hit on the first two workflow runs.
          sudo apt-get update
          sudo apt-get install -y libnetcdf-dev libhdf5-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned versions known-good together as of 2025-Q4. The
          # default (unpinned) netCDF4 1.7.x wheels have segfaulted
          # on ubuntu-latest runners during import; 1.6.5 is the last
          # widely-stable release. Pin numpy 1.26.x for ABI match.
          pip install "numpy==1.26.4" matplotlib "netCDF4==1.6.5" \
                      xarray requests Pillow

      - name: Smoke-test imports
        run: |
          # Fail fast if the Python stack segfaults — gives us a real
          # traceback instead of the render step's blind exit 139.
          python -X faulthandler -c "import netCDF4; print('netCDF4', netCDF4.__version__)"
          python -X faulthandler -c "import generate_sst_plots; print('generate_sst_plots OK')"
          python -X faulthandler -c "import generate_subsurface_plots; print('generate_subsurface_plots OK')"
          python -X faulthandler -c "import generate_global_crw_anom_gif; print('generate_global_crw_anom_gif OK')"

      - name: Download Natural Earth basemaps
        run: |
          set -euo pipefail
          NE="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson"
          # 50 m resolution for crisp coastlines on a global view. The
          # 110 m files are the fallback the generator uses when a 50 m
          # file isn't present.
          for f in ne_50m_coastline.geojson ne_50m_admin_0_countries.geojson \
                   ne_110m_coastline.geojson ne_110m_admin_0_countries.geojson; do
            if [ ! -f "$f" ]; then
              echo "--- Downloading $f ---"
              curl -fSL --retry 3 --retry-delay 10 -o "$f" "$NE/$f" \
                || echo "(optional file $f failed — OK)"
            fi
            ls -lh "$f" 2>/dev/null || true
          done

      - name: Render Global CRW Anomaly GIF
        env:
          # Force unbuffered stdout/stderr so progress logs appear in
          # real time in the Actions UI (and so any crash traceback
          # isn't swallowed by the block buffer).
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          set -eo pipefail
          OUT="global_crw_anom_${{ inputs.start }}_to_${{ inputs.end }}.gif"
          echo "Output file: $OUT"
          python -X faulthandler generate_global_crw_anom_gif.py \
            --start  "${{ inputs.start }}" \
            --end    "${{ inputs.end }}" \
            --fps    "${{ inputs.fps }}" \
            --step   "${{ inputs.step }}" \
            --colors "${{ inputs.colors }}" \
            --out    "$OUT"
          ls -lh "$OUT"
          # Stash the exact name so the upload step can find it without
          # having to recompute the template.
          echo "GIF_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Upload GIF as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: global-crw-anom-gif
          path: ${{ env.GIF_PATH }}
          # Short retention — this is a one-off post asset, not a
          # long-lived deliverable. Download it promptly after the run.
          retention-days: 14
          if-no-files-found: error
