name: TCHP Records Bake (TEMP - delete after sign-off)

# TEMPORARY, DELETABLE dispatch (set up for a one-off review render; delete this
# file after sign-off + merge). It bakes the ARMOR3D per-week-of-year TCHP record
# envelope (1993-present) HERE on the GitHub-hosted runner - the SAME box+env the
# daily ARMOR3D anomaly already runs in - REUSING the existing Copernicus Marine
# secrets (no credentials moved or copied anywhere new). Then it uploads the
# envelope to R2 sst/records/, renders the FIRST real records anomaly maps from
# the tchp-records BRANCH code, and posts them to a REVIEW path on R2.
#
# HOLD: nothing is merged to main and nothing is served on the live /sst widget.
# The live armor3d/ PNGs and static_manifest are untouched; the envelope sits in
# R2 sst/records/ (the live main-branch generator doesn't read it) and the crops
# in R2 sst/records/review/. Records go live only when the branch is merged.
#
# Resumable: the 1993-present pass is chunked under GitHub's 6h ceiling via the
# state cache + --time-budget-minutes; this workflow re-dispatches ITSELF until
# the pass completes, then finalizes + renders + posts the review crops.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write            # to self-re-dispatch for the chunked resume

concurrency:
  group: tchp-records-bake
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Check out the tchp-records BRANCH (not main)
        uses: actions/checkout@v6
        with:
          ref: tchp-records

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps (same pins as the ARMOR3D workflows)
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib netCDF4 xarray requests \
                      "copernicusmarine>=2.1,<3.0"

      - name: Restore records state from cache
        uses: actions/cache/restore@v5
        with:
          path: .armor3d_records_state
          key: armor3d-records-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            armor3d-records-state-v1-

      - name: Bake the record envelope (resumable, ~5.3h budget)
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          set -eo pipefail
          python bake_armor3d_tchp_records.py --run --time-budget-minutes 320

      - name: Flush disk buffers before cache save
        if: always()
        run: |
          sync || true
          sleep 5

      - name: Save records state to cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .armor3d_records_state
          key: armor3d-records-state-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Is the 1993-present pass complete?
        id: done
        run: |
          MARK=.armor3d_records_state/last_year_completed.txt
          END=$(python -c "import datetime; print(datetime.date.today().year - 1)")
          if [ -f "$MARK" ] && [ "$(cat $MARK)" -ge "$END" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "Bake COMPLETE (marker $(cat $MARK) >= end $END)."
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "Bake NOT done (marker $(cat $MARK 2>/dev/null || echo none), end $END) - will continue."
          fi

      - name: Continue (re-dispatch self) if not complete
        if: steps.done.outputs.complete == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Re-dispatching to continue the resumable pass (cache holds progress)."
          gh workflow run tchp-records-bake-DISPATCH.yml --ref main

      - name: Finalize envelope + upload to R2 + render REVIEW crops
        if: steps.done.outputs.complete == 'true'
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -eo pipefail
          # 1) finalize -> sst/records/*.nc + manifest, then upload (NOT live /sst)
          python bake_armor3d_tchp_records.py --finalize
          bash scripts/upload_to_r2.sh \
            sst/records/armor3d_tchp_record_1993_present.nc \
            sst/records/armor3d_tchp_record_1993_present.nc
          bash scripts/upload_to_r2.sh \
            sst/records/manifest.json sst/records/manifest.json
          # 2) climatology (anomaly input) from R2
          curl -fsSL https://cdn.triple-a-tropics.com/armor3d/armor3d_climatology.nc \
            -o armor3d/armor3d_climatology.nc || true
          # 3) render the REAL records anomaly maps (branch code finds the local
          #    envelope at RECORDS_PATH -> hatch). Maps only.
          for REG in east-pacific north-atlantic western-atlantic global-tropics; do
            python generate_armor3d_plots.py --region "$REG" --maps-only || \
              echo "render $REG failed (non-fatal)"
          done
          # 4) upload ONLY the *_tchp_anom* PNGs to the REVIEW path (never live armor3d/)
          for REG in east-pacific north-atlantic western-atlantic global-tropics; do
            for SUF in "" "_labels"; do
              F="armor3d/${REG}_tchp_anom${SUF}.png"
              if [ -f "$F" ]; then
                bash scripts/upload_to_r2.sh "$F" \
                  "sst/records/review/${REG}_tchp_anom${SUF}.png" "no-cache" "image/png"
              fi
            done
          done
          echo "REVIEW crops -> https://cdn.triple-a-tropics.com/sst/records/review/<region>_tchp_anom.png"
