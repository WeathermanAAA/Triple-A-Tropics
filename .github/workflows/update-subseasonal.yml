# Subseasonal drivers — MJO RMM diagrams + velocity-potential anomaly maps.
# R2-only (read-only contents, like update-hafs / emit-geo-global): renders to
# subseasonal/out/ and syncs the PNGs + meta JSONs to the CDN bucket. Nothing
# is committed to main (the repo is near its size quota; images live on R2).
#
# Daily at 15:41 UTC (staggered non-round minute — the repo-standard pattern;
# GitHub sheds :00-family crons) + a :11 backup 30 min later. By 15Z the BoM
# RMM file has that day's update and the GFS 06Z/12Z analysis is long since
# on AWS; both generators also self-heal (RMM staleness gate + cache, GFS
# cycle walk-back), so a missed day costs freshness, never correctness.
#
# The VP product is TIME-MEAN (v2): it rides a rolling daily-chi archive in
# R2 (_buildcache/chi_daily_archive.nc, ~50 KB/day) restored before and
# saved after each render. A normal daily run tops up 1-2 missing days;
# backfill_days=250 on a manual dispatch bootstraps a cold archive in one
# run (~250 days x 4 GFS cycles, ~300 KB each — well inside the timeout).
#
# Phase 2 Hovmöllers (generate_hovmollers.py) run AFTER the VP render so
# their chi200 panels read the chi archive the VP step just topped up.
# Their zonal-wind panels ride an equivalent rolling daily-u archive
# (_buildcache/u_daily_archive.nc, GFS 1p00 UGRD 200/850 over 22S-22N)
# with the same restore/save bracketing; the same backfill_days input
# bootstraps it cold. The OLR/wave panels need no archive (PSL OPeNDAP
# each run) and the generator isolates each section, so one flaky
# upstream never blanks the others.
name: update-subseasonal

on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "max missing archive days to fetch this run"
        required: false
        default: "45"
  schedule:
    - cron: "41 15 * * *"
    - cron: "11 16 * * *"   # backup tick; concurrency group serializes

permissions:
  contents: read

concurrency:
  group: update-subseasonal
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # 200: the Phase-3 wave overlays multiply the Hovmöller panel matrix
    # (every variable × 8 wave sets) and add per-band VP map variants —
    # measured locally at ~1.2 s/panel, but leave headroom for cold
    # archives + slow upstreams. Revisit after the first few runs.
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --quiet --upgrade pip
          # pyshtools (wheeled) powers the chi spectral solve — pyspharm/
          # windspharm have no wheels and their Fortran build breaks in CI
          pip install --quiet numpy matplotlib xarray netCDF4 requests \
            pyshtools herbie-data cfgrib eccodes

      # (the MJO render moved AFTER the u-archive restore — the GEFS RMM
      # forecast's obs side reads the restored GFS wind archive)

      - name: Restore daily-chi archive from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p subseasonal/out
          aws s3 cp \
            s3://triple-a-tropics-media/_buildcache/chi_daily_archive.nc \
            subseasonal/out/chi_daily_archive.nc \
            --endpoint-url "$R2_ENDPOINT" \
            || echo "no archive yet — cold start (bootstraps itself)"

      - name: Render velocity-potential anomalies
        run: |
          python generate_velocity_potential.py \
            --backfill-days "${{ inputs.backfill_days || '45' }}"

      # runs even if the render step failed after backfill — a day's
      # fetched analyses are never lost to a rendering bug
      - name: Save daily-chi archive to R2
        if: always()
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          test -f subseasonal/out/chi_daily_archive.nc || exit 0
          aws s3 cp subseasonal/out/chi_daily_archive.nc \
            s3://triple-a-tropics-media/_buildcache/chi_daily_archive.nc \
            --endpoint-url "$R2_ENDPOINT"

      - name: Restore daily-u archive from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          aws s3 cp \
            s3://triple-a-tropics-media/_buildcache/u_daily_archive.nc \
            subseasonal/out/u_daily_archive.nc \
            --endpoint-url "$R2_ENDPOINT" \
            || echo "no u archive yet — cold start (bootstraps itself)"

      - name: Render MJO RMM products (+ GEFS member forecast)
        # after the u restore on purpose: the RMM forecast's obs winds
        # come from the restored archive; the forecast layer is additive
        # (--forecast failure keeps the observed-only renders)
        run: |
          python generate_mjo_rmm.py --forecast \
            --u-archive subseasonal/out/u_daily_archive.nc

      - name: Render Hovmöllers (OLR + waves, u850/u200/v850, chi200 + GEFS tails)
        run: |
          python generate_hovmollers.py \
            --u-backfill-days "${{ inputs.backfill_days || '45' }}"

      # runs even if the render step failed after backfill — a day's
      # fetched analyses are never lost to a rendering bug
      - name: Save daily-u archive to R2
        if: always()
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          test -f subseasonal/out/u_daily_archive.nc || exit 0
          aws s3 cp subseasonal/out/u_daily_archive.nc \
            s3://triple-a-tropics-media/_buildcache/u_daily_archive.nc \
            --endpoint-url "$R2_ENDPOINT"

      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          # PNGs + meta only — never the RMM cache (server-side artifact)
          rm -f subseasonal/out/_rmm_cache.json
          aws s3 sync subseasonal/out/ s3://triple-a-tropics-media/subseasonal/ \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=600" \
            --exclude "*" --include "*.png" --include "*.json"
          echo "published:"
          aws s3 ls s3://triple-a-tropics-media/subseasonal/ --endpoint-url "$R2_ENDPOINT"
