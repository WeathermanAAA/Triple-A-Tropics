# GEO-RING global composite emitter — GH-Actions STOPGAP until the box's s2
# emit-cron session is running (queued manual step). Emits the 3 geo-global
# BT fields (ir / irbd / wv) off one pinned scan: GOES-19 + GOES-18 +
# Himawari-9 (+ Meteosat 0°/IODC once the EUMETSAT_* secrets exist — the
# members are creds-gated and degrade honestly to the labeled gap without
# them). Writes tiles + bt.png + manifest straight to R2; commits NOTHING
# to main (read-only contents, like update-hafs).
#
# Every 30 min at :23/:53 (staggered non-round minutes — GitHub drops
# :00-family crons under load; the stagger is load-bearing, do not "clean
# it up"). GEO ONLY: the wpac-ir/fd-ir diagnostic riders moved to their own
# workflow (emit-diag-riders.yml) — sequencing them BEFORE geo in this job
# put up to ~56 min of setup+riders in front of the world composite every
# run, which (with the old oldest-first slot walk) is exactly the tester
# report "viewer shows 1630Z when 1750Z is live". Two lanes = two runners;
# both are per-slot idempotent via the ready markers.
#
# NEWEST-FIRST: tsr-s2 commit c5da203 makes _backfill_slots render the
# newest slot FIRST, so freshness is independent of --backfill depth (older
# holes heal with whatever budget remains; a timeout kill costs only
# old-slot work). Until that commit is pushed to s2-sat-ingest (needs
# Andrew's tsr auth), the "newest-first" step below applies the same
# one-line change idempotently: once upstream carries the fix the step
# no-ops with a delete-me notice, and any OTHER divergence fails loudly.
#
# CADENCE BUDGET (2026-07-12 incident — do not tighten without re-measuring):
# one geo-global slot = 3 products ≈ 19–20 MEASURED minutes on a GH runner
# (AHI FLDK segments + 2x GOES CMIPF + composite + tiles). A GH runner
# sustains ~3 geo slots/hour, so the STOPGAP world cadence is 30-min slots;
# the box s2 cron (Q11) is the 10-min home. With newest-first, steady-state
# staleness of the newest visible slot ≈ scan→run gap (0–30 min) + setup
# (~6 min) + one slot render (~20 min) ≈ 25–55 min, vs 75–105+ before.
# When the box cron is live, BOTH writers stay idempotent per-frame
# (ready-marker dedup), but disable this cron (workflow_dispatch stays for
# on-demand re-emits).
name: emit-geo-global

# SCHEDULE RETIRED 2026-08-03 (R2 cost incident): the box geo lane
# (tat-s2-geo on box2, 300 s interval) has owned geo-global at 144 frames/day
# per product since 2026-07-25 — the disable condition the header above
# always stated. Recent runs here spent 42-45 min to emit NOTHING
# ("0/3 slot(s) missing") because this workflow checks out s2-sat-ingest
# (frozen pre the 07-25 delimiter-listing fix) and burns ~4,800 flat-walk
# LIST pages per run (~150k Class A/day) purely re-discovering that the box
# already published every slot. workflow_dispatch stays for on-demand
# re-emits; repoint the ref to main before dispatching.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emit-geo-global
  cancel-in-progress: false

jobs:
  emit:
    runs-on: ubuntu-latest
    # budget: setup ~6 + geo ≤75 (newest slot first; overlapping crons
    # serialize on the concurrency group and a timeout kill loses nothing —
    # per-slot emits are idempotent, the next tick resumes).
    timeout-minutes: 85
    steps:
      - name: Checkout tat-satellite-render (s2-sat-ingest)
        uses: actions/checkout@v6
        with:
          repository: WeathermanAAA/tat-satellite-render
          ref: s2-sat-ingest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps (box parity + Meteosat extra)
        run: |
          python -m pip install --quiet --upgrade pip
          # full tsr set = exact box parity; requirements-s2-geo adds satpy so
          # the Meteosat members light the moment the EUMETSAT_* secrets land
          pip install --quiet -r requirements.txt -r requirements-s2-geo.txt

      - name: Emit geo-global suite to R2 (30-min slots, newest first)
        timeout-minutes: 75
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Meteosat members: absent secrets => honest transparent gap
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
        run: |
          set -euo pipefail
          # newest slot lands first (~20 min in); the rest of the budget
          # heals the trailing 90-min window. 10-min world cadence comes
          # from the box (Q11), not from here.
          python s2_pyramid_emit.py --suite geo-global \
            --store r2 --prefix shadow --max-zoom 5 \
            --step 30 --backfill 90
