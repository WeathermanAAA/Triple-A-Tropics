name: update-ascat

# ASCAT scatterometer ocean-surface winds (EUMETSAT/OSI SAF), Observations.
# Self-contained + isolated: pulls ASCAT-B/C 12.5 km coastal NRT NetCDF per orbit
# from NASA PO.DAAC (Earthdata; CMR granule search + bearer-token download, ~2-4 h
# latency), decodes + quality-masks + decimates each orbit to JSON, tags passes with
# the active storms they overfly (read-only consumer of the published
# global_storms.geojson), and syncs the tree to R2 under ascat/. Touches NOTHING in
# the track/ACE/climatology pipeline. KNMI Open Data (~daily batch) is the automatic
# FALLBACK when the Earthdata creds are absent, so the product never goes dark.
#
# Cadence: PO.DAAC publishes per orbit (~one new orbit every ~50 min across B+C) at
# ~2-4 h latency, so we poll HOURLY on a staggered (non-round) minute to keep the
# newest pass within a few hours. The filename-timestamp watermark makes a re-run a
# cheap no-op and the rolling window self-heals any dropped run, so no backup cron.
#
# Window: 60 h so the manifest holds plenty of passes for a near-complete global
# tiling; the /ascat/ viewer re-polls R2 and caps the Global view at GLOBAL_MAX_PASSES.

on:
  schedule:
    - cron: "17 * * * *"          # hourly, staggered minute (per-orbit NRT feed)
  workflow_dispatch:
    inputs:
      window_hours:
        description: "Display window in hours (passes older are pruned)"
        default: "60"
      backfill_hours:
        description: "Widen the INGEST reach for a manual catch-up (blank = none)"
        default: ""

permissions:
  contents: read            # R2-only product; commits nothing to main

# Serialized so the manifest read-merge-write (the growing union) never races.
concurrency:
  group: update-ascat
  cancel-in-progress: false

jobs:
  ascat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps (NetCDF decode only - no cartopy/matplotlib)
        run: pip install --no-cache-dir numpy netCDF4 requests
      - name: Build ASCAT JSON
        env:
          ASCAT_ENABLED: ${{ vars.ASCAT_ENABLED || '1' }}
          # PO.DAAC (primary): an Earthdata bearer token, OR username+password (a
          # token is then minted at runtime). KNMI (fallback): the Open Data key.
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}
          ASCAT_WINDOW_HOURS: ${{ github.event.inputs.window_hours || '60' }}
          ASCAT_BACKFILL_HOURS: ${{ github.event.inputs.backfill_hours || '' }}
        run: |
          set -euo pipefail
          # Need a source credential: PO.DAAC (EARTHDATA_TOKEN, or USERNAME+PASSWORD)
          # or the KNMI fallback (KNMI_API_KEY). None -> guarded skip, R2 stays live.
          if [ -z "${EARTHDATA_TOKEN:-}" ] \
             && { [ -z "${EARTHDATA_USERNAME:-}" ] || [ -z "${EARTHDATA_PASSWORD:-}" ]; } \
             && [ -z "${KNMI_API_KEY:-}" ]; then
            echo "ascat: no source creds (EARTHDATA_TOKEN / EARTHDATA_USERNAME+PASSWORD for PO.DAAC, or KNMI_API_KEY) - skipping (last-known-good R2 stays live)"
            exit 0
          fi
          ARGS="--out-dir ./ascat_build --window-hours ${ASCAT_WINDOW_HOURS}"
          if [ -n "${ASCAT_BACKFILL_HOURS}" ]; then
            ARGS="$ARGS --backfill-hours ${ASCAT_BACKFILL_HOURS}"
          fi
          python generate_ascat.py $ARGS
      - name: Sync to R2
        # Guard: only sync when the build wrote a manifest (kill switch / no key /
        # total failure leaves ascat_build without one -> last-known-good R2 stays
        # live). The viewer also ?t=-busts the manifest/current.
        if: ${{ vars.ASCAT_ENABLED != 'false' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ ! -f ./ascat_build/manifest.json ]; then
            echo "ascat: no manifest written - skipping R2 sync (last-known-good stays live)"
            exit 0
          fi
          # No --delete: ascat_build holds only THIS run's new passes plus the
          # manifest/current; out-of-window passes stay live on R2 until the prune
          # reaps them below. The _pruned_ids.json sidecar is not a served file.
          aws s3 sync ./ascat_build "s3://triple-a-tropics-media/ascat" \
            --endpoint-url "$R2_ENDPOINT" \
            --no-progress \
            --exclude "_pruned_ids.json" \
            --content-type "application/json" \
            --cache-control "public, max-age=300"
          # Reap pass JSON the manifest prune removed (rolling-window expiry).
          # Targeted rm of each pruned id ONLY -- never a blanket --delete.
          if [ -f ./ascat_build/_pruned_ids.json ]; then
            python -c "import json;print('\n'.join(json.load(open('./ascat_build/_pruned_ids.json'))))" \
            | while read -r pid; do
                [ -z "$pid" ] && continue
                echo "ascat: reaping pruned R2 pass ascat/$pid.json"
                # NB: `aws s3 rm` does NOT accept --no-progress (that's a sync/cp
                # flag) - passing it makes every reap fail with ParamValidation and
                # leaves pruned pass JSON orphaned on R2. Plain rm.
                aws s3 rm "s3://triple-a-tropics-media/ascat/$pid.json" \
                  --endpoint-url "$R2_ENDPOINT" || true
              done
          fi
