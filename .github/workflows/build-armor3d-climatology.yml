name: Build ARMOR3D Climatology

# One-off (re-runnable) workflow that pulls ~28 years of ARMOR3D
# reanalysis temperature from Copernicus Marine and builds the weekly
# TCHP + equatorial-T climatology file used by the cross-section and
# TCHP-anomaly plots. Fire it from the Actions tab:
#     Actions → "Build ARMOR3D Climatology" → "Run workflow".
#
# Runtime is dominated by CMEMS throttling. The script subsamples the
# daily ARMOR3D product down to 52 days/year (one per week bucket), so
# download volume is ~7× smaller than a naive year-at-a-time fetch.
# Even so, GitHub's hard 6-hour job limit may clip it, so the script is
# written to be resumable at the *week* level: per-week raw files and
# per-year state files live in `.armor3d_climo_state/`, which we stash
# in the Actions cache between runs. If the workflow times out, just
# re-run it — already-fetched weeks are skipped automatically on the
# next invocation, and the final `armor3d/armor3d_climatology.nc` is
# committed on whichever run finally finishes year 2020.
on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "First climatology year"
        default: "1993"
      end_year:
        description: "Last climatology year (inclusive)"
        default: "2020"
      combine_only:
        description: "Skip fetching — only combine existing per-year state"
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

# One build at a time. This job takes hours and makes real CMEMS
# API calls; double-running would just fight over the cache.
concurrency:
  group: build-armor3d-climatology
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Just under GH's 360-minute ceiling so the post-job cache save
    # has a chance to persist partial progress before the runner is
    # force-terminated.
    timeout-minutes: 340

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Same pin window as update-armor3d.yml — v2 is the only
          # published copernicusmarine series as of 2025.
          pip install numpy matplotlib netCDF4 xarray requests \
                      "copernicusmarine>=2.1,<3.0"

      - name: Restore per-year climo state from cache
        id: state-cache
        uses: actions/cache/restore@v4
        with:
          path: .armor3d_climo_state
          # Unique per run so save always writes a fresh entry.
          key: armor3d-climo-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          # Prefix-match restore so we pick up the newest save from
          # any prior run.
          restore-keys: |
            armor3d-climo-state-v1-

      - name: Build climatology (resumable)
        # Pass --time-budget-minutes so the Python script exits cleanly
        # well before GitHub's step timeout kills it mid-write. We set
        # it at 320 min, leaving ~20 min of headroom for the sync +
        # cache-save steps below to run on a quiescent filesystem.
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          set -eo pipefail
          ARGS="--start-year ${{ inputs.start_year }} --end-year ${{ inputs.end_year }} --time-budget-minutes 320"
          if [ "${{ inputs.combine_only }}" = "true" ]; then
            ARGS="$ARGS --combine-only"
          fi
          echo "Running: python build_armor3d_climatology.py $ARGS"
          python build_armor3d_climatology.py $ARGS

      - name: Flush disk buffers before cache save
        # Prior run's cache save failed with "file changed as we read it"
        # because the Python process was still flushing writes when tar
        # started archiving. With the time-budget flag above the script
        # should exit well before any forced kill, but we also sync the
        # filesystem and sleep briefly as a belt-and-suspenders so the
        # cache-save step below sees a quiescent .armor3d_climo_state/.
        if: always()
        run: |
          sync || true
          sleep 5

      - name: Save per-year climo state to cache
        # always() so a timeout / interrupted run still persists
        # whatever years were already processed, letting the next
        # invocation pick up from where we left off.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .armor3d_climo_state
          key: armor3d-climo-state-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit climatology file if it was built
        # armor3d_climatology.nc only appears when the combine step
        # runs successfully — i.e. all requested years had state.
        # On a partial run we just noop and wait for a re-invoke.
        run: |
          set -eo pipefail
          if [ ! -f armor3d/armor3d_climatology.nc ]; then
            echo "No climatology file produced this run — per-year state is still accumulating."
            echo "Re-run this workflow once the cache has saved; already-fetched years will be skipped."
            exit 0
          fi
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add armor3d/armor3d_climatology.nc
          if git diff --cached --quiet; then
            echo "armor3d_climatology.nc already up-to-date."
            exit 0
          fi
          git commit -m "chore: build ARMOR3D 1993-2020 climatology"

          # Same rebase-and-push loop as the other workflows — this
          # one-off run may still race with scheduled SST / ARMOR3D
          # updates pushing to main.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt — fetching + rebasing..."
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase failed (unexpected conflict)." >&2
              git rebase --abort || true
              exit 1
            }
            sleep $((attempt * 2))
          done
          echo "Push still failing after 5 attempts." >&2
          exit 1
