# TEMPORARY canary - delete after the actions/cache v4->v5 bump is confirmed.
#
# Proves, with zero risk, that cache entries SAVED by actions/cache@v4 are
# RESTORABLE by actions/cache/restore@v5 before the real workflows switch:
# a lookup-only restore (metadata check, no download, no save) against the
# live SST animator frame-cache prefix. The stake: a false cache miss after
# the bump would mean a ~6 h cold re-render of ~12,960 frames.
name: cache-v5-canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe SST frame cache with restore@v5 (lookup-only)
        id: probe
        uses: actions/cache/restore@v5
        with:
          path: _frame_cache
          key: sst-mp4-frames-v3-canary-probe-never-matches
          restore-keys: |
            sst-mp4-frames-v3-
          lookup-only: true

      - name: Report
        run: |
          echo "cache-hit:         ${{ steps.probe.outputs.cache-hit }}"
          echo "cache-matched-key: ${{ steps.probe.outputs.cache-matched-key }}"
          if [ -n "${{ steps.probe.outputs.cache-matched-key }}" ]; then
            echo "PASS: v5 restore found a v4-saved entry"
          else
            echo "FAIL: v5 restore found NO entry under the v3 prefix"
            exit 1
          fi
