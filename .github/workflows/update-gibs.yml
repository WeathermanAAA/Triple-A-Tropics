name: Update GIBS True Color

# NASA GIBS MODIS/VIIRS true-color "latest pass" stills (Part B of the
# true-color feature). GIBS daily composites fill through the UTC day, and
# the generator falls back to the freshest *complete* day, so a single late-
# day run is plenty fresh. 22:07 UTC sits well clear of every other scheduled
# slot (SST 13:17/13:47, subsurface 14:23/14:53, ARMOR3D 14:43, season-gifs
# 03:23); :07 is a non-round minute per the repo's stagger convention, with a
# 22:37 backup 30 min later in case the primary is dropped under load.
on:
  schedule:
    - cron: "7 22 * * *"
    - cron: "37 22 * * *"
  workflow_dispatch: {}

# Read-only: this workflow commits nothing to main. All output (18 JPEGs +
# manifest.json) is uploaded to R2; the frontend reads the manifest from
# cdn.triple-a-tropics.com, same as the SST/subsurface media.
permissions:
  contents: read

# One GIBS run at a time. Each run fully rewrites gibs/ then syncs to R2;
# overlapping runs would just duplicate ~50-100 GIBS requests for no benefit.
concurrency:
  group: update-gibs
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Pure HTTP fetch (requests) + image work (Pillow/numpy) + the
          # title-strip composite (matplotlib). No netCDF4/xarray/cartopy —
          # GIBS hands back finished true-color JPEGs, no projection math.
          pip install numpy matplotlib requests Pillow

      - name: Generate GIBS true-color stills
        # Fetches the freshest adequately-filled MODIS/VIIRS daily composite
        # per region (gap-filled across sensors), renders 18 photographic
        # JPEGs + manifest.json into gibs/. No credentials needed.
        run: python generate_gibs_truecolor.py

      - name: Upload GIBS stills to R2 (cdn.triple-a-tropics.com/gibs/)
        # Content-types set EXPLICITLY: image/jpeg (the stills) and
        # application/json (the manifest, fetched cross-origin → needs the
        # right type + CORS). NO --size-only: unlike the version-pathed SST
        # media, these JPEGs reuse the same key every day with new content,
        # so a coincidental same-byte-size day must NOT be skipped. Default
        # sync (size + mtime) re-uploads the freshly rendered files.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          SRC=gibs
          if [ ! -d "$SRC" ] || [ -z "$(ls -A "$SRC" 2>/dev/null)" ]; then
            echo "No GIBS output at $SRC — nothing to upload."
            exit 1
          fi
          CC="public, max-age=300"
          DST=s3://triple-a-tropics-media/gibs/
          aws s3 sync "$SRC" "$DST" --endpoint-url "$R2_ENDPOINT" \
            --cache-control "$CC" --content-type "image/jpeg" \
            --exclude "*" --include "*.jpg" --only-show-errors
          aws s3 sync "$SRC" "$DST" --endpoint-url "$R2_ENDPOINT" \
            --cache-control "$CC" --content-type "application/json" \
            --exclude "*" --include "*.json" --only-show-errors
