[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hafs-render"
version = "0.13.0"
description = "Triple-A-Tropics HAFS model-plot render pipeline (ingest + render + manifest), packaged as one source of truth for the Actions cron and the box render worker."
requires-python = ">=3.10"
# matplotlib + numpy are PINNED so the cron and the worker rasterize identically
# (the pixel-parity gate is meaningless without matching pins). The rest float;
# they shape the decoded field arrays, not the rendered pixels, and the worker's
# own requirements.txt pins xarray/netCDF4 for the satellite stack. tat_palettes
# is NOT listed here (not on PyPI; provided by the environment - see __init__).
dependencies = [
    "matplotlib==3.9.3",
    "numpy==2.1.3",
    "herbie-data",
    "cfgrib",
    "eccodes",
    "xarray",
    "netCDF4",
    "requests",
    "boto3",
    # MetPy (+ its scipy) power the parent-domain environmental products: the
    # 200 mb baroclinic potential vorticity (potential_vorticity_baroclinic) and
    # the scipy Gaussian smoothing. Preflighted in a clean venv to confirm they
    # resolve WITHOUT moving the matplotlib==3.9.3 / numpy==2.1.3 pixel-parity
    # pins (metpy 1.7.x + scipy 1.18 sit happily on numpy 2.1.3). Left to float
    # like the rest of the GRIB stack.
    "metpy",
    "scipy",
]

[tool.setuptools]
packages = ["hafs_render"]
include-package-data = true

[tool.setuptools.package-data]
# Vendored basemaps + radar palette, resolved relative to the package dir by
# hafs_plot's ``HERE = Path(__file__).parent``. Bundling them makes the worker
# self-contained (no Natural Earth fetch step on the render box).
hafs_render = ["*.geojson", "assets/*.pal"]
